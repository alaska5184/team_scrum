<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팀 스크럼 스케줄러</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">

<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F7F7F7; --border:#E5E5E5; --border-strong:#D4D4D4;
  --text:#252525; --text-muted:#8A8A8A; --text-faint:#B5B5B5;
  --accent:#343434; --accent-strong:#171717; --accent-soft:#F0F0F0; --accent-contrast:#FAFAFA;
  --success:#189A6C; --success-soft:#E3F7EE; --warning:#C97A12; --warning-soft:#FBF0DA;
  --danger:#E7000B; --danger-soft:#FCEAEA; --info:#2E72D9; --info-soft:#E9F1FD;
  --weekend-bg:#FAFAFA; --holiday-bg:#FCEAEA; --today-line:#E7000B;
  --p1:#E7000B; --p2:#C97A12; --p3:#8A8A8A;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 10px 30px -14px rgba(20,20,20,.18);
  --shadow-sm:0 1px 2px rgba(20,20,20,.06);
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --font-ui:'Pretendard Variable','Pretendard',-apple-system,'system-ui','Segoe UI',Roboto,'Noto Sans KR',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#252525; --surface:#2E2E2E; --surface-2:#333333; --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.2);
    --text:#FAFAFA; --text-muted:#B5B5B5; --text-faint:#8A8A8A;
    --accent:#E5E5E5; --accent-strong:#FFFFFF; --accent-soft:#404040; --accent-contrast:#252525;
    --success:#41CE98; --success-soft:#123528; --warning:#F0AD52; --warning-soft:#3B2C10;
    --danger:#FF6467; --danger-soft:#3C1F1F; --info:#78ABF6; --info-soft:#182B45;
    --weekend-bg:#2A2A2A; --holiday-bg:#3C1F1F; --today-line:#FF6467;
    --p1:#FF6467; --p2:#F0AD52; --p3:#B5B5B5;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#252525; --surface:#2E2E2E; --surface-2:#333333; --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.2);
  --text:#FAFAFA; --text-muted:#B5B5B5; --text-faint:#8A8A8A;
  --accent:#E5E5E5; --accent-strong:#FFFFFF; --accent-soft:#404040; --accent-contrast:#252525;
  --success:#41CE98; --success-soft:#123528; --warning:#F0AD52; --warning-soft:#3B2C10;
  --danger:#FF6467; --danger-soft:#3C1F1F; --info:#78ABF6; --info-soft:#182B45;
  --weekend-bg:#2A2A2A; --holiday-bg:#3C1F1F; --today-line:#FF6467;
  --p1:#FF6467; --p2:#F0AD52; --p3:#B5B5B5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:14px;line-height:1.43;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;}
.hidden,[hidden]{display:none!important;}
::-webkit-scrollbar{height:10px;width:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- login ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:
  radial-gradient(1200px 600px at 15% -10%, var(--accent-soft), transparent 60%),
  radial-gradient(900px 500px at 110% 10%, var(--info-soft), transparent 55%), var(--bg);}
.loginCard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:36px 30px 28px;}
.loginMark{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,var(--accent),var(--accent-strong));display:flex;align-items:center;justify-content:center;color:var(--accent-contrast);font-weight:600;font-size:18px;margin-bottom:18px;}
.loginCard h1{font-size:19px;margin:0 0 6px;letter-spacing:-.01em;}
.loginCard p.sub{margin:0 0 24px;color:var(--text-muted);font-size:13px;line-height:1.6;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:500;color:var(--text-muted);margin-bottom:6px;}
.field .inputWrap{position:relative;}
.field input{width:100%;padding:11px 13px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface-2);font-size:14px;color:var(--text);}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
.pwToggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-faint);font-size:12px;padding:6px 8px;border-radius:6px;}
.pwToggle:hover{background:var(--accent-soft);color:var(--accent);}
.btnPrimary{width:100%;padding:12px;border:none;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-contrast);font-weight:500;font-size:15px;box-shadow:var(--shadow-sm);}
.btnPrimary:hover{background:var(--accent-strong);}
.loginFoot{margin-top:18px;font-size:12px;color:var(--text-faint);line-height:1.6;text-align:center;}
.loginFoot a{color:var(--accent);}
.demoHint{margin-top:16px;background:var(--accent-soft);color:var(--accent-strong);border-radius:var(--r-sm);padding:10px 12px;font-size:12px;line-height:1.6;font-family:var(--font-mono);}
.loginErr{background:var(--danger-soft);color:var(--danger);font-size:13px;border-radius:var(--r-sm);padding:9px 11px;margin-bottom:14px;}

/* ---------- app shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}
header.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--border);padding:10px max(16px, calc(50% - 576px));display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap;}
.brand .dot{width:9px;height:9px;border-radius:3px;background:linear-gradient(145deg,var(--accent),var(--accent-strong));}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;}
.tabs button{border:none;background:none;padding:7px 15px;border-radius:999px;font-size:13px;font-weight:500;color:var(--text-muted);}
.tabs button.active{background:var(--accent);color:var(--accent-contrast);}
.topbar .spacer{flex:1;}
.selectWrap{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface-2);border-radius:999px;padding:0 10px 0 12px;}
.selectWrap .selectIcon{flex:none;color:var(--text-muted);}
.selectWrap .selectPill{border:none;background:transparent;padding:7px 4px 7px 0;}
.selectPill{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--text);}
.iconBtn{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:var(--r-sm);padding:7px 12px;font-size:13px;font-weight:500;color:var(--text);display:inline-flex;align-items:center;gap:6px;}
.iconBtn:hover{border-color:var(--accent);color:var(--accent-strong);}
.iconBtn.solid{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);}
.iconBtn.solid:hover{background:var(--accent-strong);}
.avatarBtn{display:flex;align-items:center;gap:8px;border:none;background:transparent;border-radius:8px;padding:4px 6px;}
.avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;flex:none;}
.avatarBtn .who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;}
.avatarBtn .who b{font-size:12px;}
.avatarBtn .who span{font-size:11px;color:var(--text-muted);}

main{flex:1;display:flex;flex-direction:column;min-width:0;max-width:1152px;margin:0 auto;width:100%;}

/* ---------- schedule controls ---------- */
.scheduleBar{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface);}
.scheduleBarRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.scheduleBar h2{font-size:23px;margin:0;font-weight:600;letter-spacing:-0.46px;line-height:29.9px;font-variant-numeric:tabular-nums;}
.segTabs{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
.segTabs button{border:none;background:none;padding:6px 13px;border-radius:999px;font-size:12px;font-weight:500;color:var(--text-muted);}
.segTabs button.active{background:var(--accent-soft);color:var(--accent-strong);}
.navBtns{display:flex;gap:4px;}
.navBtns button{height:30px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface-2);font-size:13px;white-space:nowrap;}
.navBtns button#prevBtn,.navBtns button#nextBtn{width:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;}
.navBtns button#todayBtn{width:auto;padding:0 14px;}
.navBtns button:hover{border-color:var(--accent);color:var(--accent-strong);}
.lucide-ic{flex:none;vertical-align:-2px;}

/* ---------- timeline ---------- */
.timelineWrap{position:relative;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:stretch;}
.timelineScroll{flex:1 1 auto;overflow-x:auto;overflow-y:visible;position:relative;}
.timelineInner{position:relative;}
.tlHeaderRow{display:flex;position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);}
.tlDayHead{flex:none;text-align:center;padding:8px 2px 7px;font-size:11px;color:var(--text-muted);border-right:1px solid var(--border);cursor:pointer;user-select:none;}
.tlDayHead .dow{display:block;font-weight:500;}
.tlDayHead .dnum{display:block;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px;color:var(--text);}
.tlDayHead .hname{display:block;font-size:9px;color:var(--danger);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tlDayHead.weekend{background:var(--weekend-bg);}
.tlDayHead.holiday{background:var(--holiday-bg);}
.tlDayHead.today{background:var(--surface-2);}
.tlDayHead.today .dow{color:var(--text);font-weight:600;}
.dnumBadge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-contrast);font-size:12px;}
.tlDayHead:hover{background:var(--accent-soft);}
.tlBg{position:absolute;top:0;bottom:0;pointer-events:none;}
.tlBg.weekend{background:var(--weekend-bg);}
.tlBg.holiday{background:var(--holiday-bg);}
.tlToday{position:absolute;top:0;bottom:0;width:2px;background:var(--today-line);z-index:4;}
.tlSection{position:relative;}

.tlBody{position:relative;}
.bar{position:absolute;border-radius:8px;padding:0 9px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;white-space:nowrap;overflow:visible;border:1px solid transparent;}
.bar span.lbl{overflow:hidden;text-overflow:ellipsis;}
.bar.vac,.bar.ext{background:var(--surface);border-style:dashed;box-shadow:none;}
.bar.task{background:var(--surface);border-color:var(--border-strong);color:var(--text);}
.bar.task .code{font-family:var(--font-mono);font-size:10px;color:var(--accent-strong);background:var(--accent-soft);border-radius:4px;padding:1px 5px;flex:none;}
.bar.task .prog{flex:none;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);}
.bar.task.closed{opacity:.55;}
.bar.task{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:5px 9px;}
.bar.task .tlBarTop{display:flex;align-items:center;gap:5px;width:100%;overflow:hidden;}
.bar.task .tlBarTop .lbl{overflow:hidden;text-overflow:ellipsis;}
.bar.task .tlBarCat{flex:none;font-size:10px;font-weight:500;color:var(--text-muted);background:var(--surface-2);border-radius:4px;padding:1px 5px;}
.bar.task .tlBarMeta{font-size:10px;color:var(--text-muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
.bar:hover{filter:brightness(0.98);z-index:6;}
.emptyNote{padding:22px;text-align:center;color:var(--text-faint);font-size:13px;}

/* ---------- scrum ---------- */
.scrumHead{padding:20px 16px 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.scrumHead h2{font-size:18px;margin:0;font-weight:600;letter-spacing:-0.18px;line-height:25.6px;}
.scrumHead .cnt{font-size:12px;color:var(--text-muted);}
.scrumCols{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 16px 28px;}
@media (max-width:720px){.scrumCols{grid-template-columns:1fr;}}
.scrumCol{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px;min-height:120px;}
.scrumCol h3{margin:2px 6px 10px;font-size:13px;font-weight:600;color:var(--text-muted);display:flex;align-items:center;gap:6px;}
.scrumCol h3 .badge{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:1px 8px;font-size:11px;}
.statusDot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex:none;}
.statusDot.done{background:var(--success);}
.scrumEmpty{color:var(--text-faint);font-size:12px;text-align:center;padding:20px 4px;}
.pendingCard{margin-bottom:10px;}
.pendingWriteBox{display:block;width:100%;margin-top:8px;padding:10px 12px;border:1px dashed var(--border-strong);border-radius:var(--r-md);background:var(--surface-2);color:var(--text-muted);font-size:12px;font-weight:500;text-align:left;cursor:pointer;}
.pendingWriteBox:hover{background:var(--accent-soft);border-color:var(--accent-strong);color:var(--accent-strong);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.card .cHead{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.card .cHead b{font-size:13px;}
.card .cHead .role{font-size:11px;color:var(--text-faint);border:1px solid var(--border);border-radius:999px;padding:0 7px;}
.card .cHead .more{margin-left:auto;border:none;background:none;color:var(--text-faint);font-size:16px;line-height:1;padding:2px 4px;display:inline-flex;align-items:center;justify-content:center;}
.card .cHead .more:hover{color:var(--accent);}
.item{padding:8px 0;border-top:1px solid var(--border);}
.item:first-of-type{border-top:none;}
.item .taskLine{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;flex-wrap:wrap;}
.item .taskLine .code{font-family:var(--font-mono);font-size:10px;color:var(--accent-strong);background:var(--accent-soft);border-radius:4px;padding:0 5px;}
.item .taskLine .prio{font-size:10px;font-weight:600;border-radius:4px;padding:0 5px;}
.item .prio.p1{background:var(--danger-soft);color:var(--p1);}
.item .prio.p2{background:var(--warning-soft);color:var(--p2);}
.item .prio.p3{background:var(--surface-2);color:var(--p3);}
.item .note{font-size:12px;color:var(--text-muted);margin-top:4px;line-height:1.5;}
.item .metaRow{display:flex;align-items:center;gap:8px;margin-top:6px;}
.progBar{flex:1;height:5px;border-radius:3px;background:var(--border);overflow:hidden;}
.progBar i{display:block;height:100%;background:var(--accent);}
.progNum{font-size:11px;color:var(--text-muted);font-family:var(--font-mono);flex:none;}
.item a.outlink{font-size:11px;color:var(--info);text-decoration:none;font-weight:500;}
.item a.outlink:hover{text-decoration:underline;}
.item .taskLine .cat{font-size:10px;color:var(--text-muted);border:1px solid var(--border);border-radius:5px;padding:0 6px;}
.item .taskLine .ticketNo{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);}
.item .taskGroup{margin-top:6px;display:flex;flex-direction:column;gap:4px;}
.item .taskRow{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text);}
.item .taskRow .lucide-ic{flex:none;color:var(--text-faint);}
.item .taskRow .taskTitle{flex:1;}
.item .taskRow .todoProg{flex:none;font-size:11px;font-family:var(--font-mono);color:var(--text-muted);}
.item .todoRow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);padding-left:18px;}
.item .todoRow .todoArrow{flex:none;color:var(--text-faint);}
.item .todoRow .todoTitle{flex:1;}
.item .todoRow .todoProg{flex:none;font-family:var(--font-mono);font-size:11px;}
.item .todoRow .prio{font-size:9.5px;font-weight:600;border-radius:4px;padding:0 4px;flex:none;}
.reviewList{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:6px;}
.reviewRow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;}
.reviewRow .rTag{background:var(--warning-soft);color:var(--warning);font-weight:600;border-radius:4px;padding:1px 6px;flex:none;}
.reviewRow .rText{color:var(--text-muted);}
.reviewRow .rTo{color:var(--accent-strong);font-weight:500;}
.reviewRow .rDate{color:var(--text-faint);font-family:var(--font-mono);margin-left:auto;}
.loadYesterdayBtn{width:100%;padding:9px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface-2);color:var(--text-muted);font-weight:500;font-size:12px;margin-bottom:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.loadYesterdayBtn:hover{color:var(--accent-strong);border-color:var(--accent);}
.sectionLabel{font-size:13px;font-weight:600;color:var(--text-muted);margin:16px 2px 8px;}
.reviewEditRow{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:6px;margin-bottom:8px;align-items:center;}
.reviewEditRow input,.reviewEditRow select{padding:7px 8px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface-2);font-size:12px;width:100%;}
.reviewEditRow button{border:none;background:none;color:var(--text-faint);font-size:13px;padding:2px 4px;}
.reviewEditRow button:hover{color:var(--danger);}
.addReviewBtn{width:100%;padding:9px;border:1px dashed var(--border-strong);border-radius:var(--r-md);background:none;color:var(--accent-strong);font-weight:500;font-size:12px;margin-top:2px;}
@media (max-width:460px){.reviewEditRow{grid-template-columns:1fr 1fr;}}

.ticketPickLabel{font-size:12.5px;font-weight:600;color:var(--text-muted);margin:14px 2px 8px;}
.ticketPickLabel .req{font-weight:500;color:var(--text-faint);}
.ticketAddRow{display:flex;gap:8px;margin-bottom:10px;}
.ticketAddRow select{flex:1;padding:9px 10px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface-2);font-size:12.5px;color:var(--text);}
.itemTicketCard{border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px;background:var(--surface);}
.itHead{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.itHead .itTicketIcon{flex:none;color:var(--text-faint);}
.itHead .code{font-family:var(--font-mono);font-size:11px;color:var(--accent-strong);background:var(--accent-soft);border-radius:4px;padding:1px 6px;flex:none;}
.itHead .itTicketTitle{font-weight:600;font-size:13px;flex:1;}
.itHead .itWho{font-size:11.5px;color:var(--text-muted);flex:none;}
.itHead .itRemove{flex:none;border:none;background:none;color:var(--text-faint);display:inline-flex;align-items:center;justify-content:center;padding:2px;}
.itHead .itRemove:hover{color:var(--danger);}
.taskBlock{border-top:1px dashed var(--border);padding-top:10px;margin-top:10px;}
.taskBlockHead{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.taskBlockTitle{flex:1;font-size:12.5px;font-weight:600;}
.taskEditBtn,.taskRmBtn{flex:none;border:none;background:none;color:var(--text-faint);display:inline-flex;align-items:center;justify-content:center;padding:2px;}
.taskEditBtn:hover{color:var(--accent-strong);}

.addItemBtn{width:100%;padding:10px;border:1px dashed var(--border-strong);border-radius:var(--r-md);background:none;color:var(--accent-strong);font-weight:500;font-size:13px;}
.chipRow{display:flex;flex-wrap:wrap;gap:6px;}
.chip{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:500;}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}

/* ---------- admin ---------- */
.adminTabs{display:flex;gap:6px;padding:14px 16px 0;}
.adminTabs button{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--text-muted);}

/* ---------------- tiny store (db-backed or in-memory fallback) ---------------- */
function makeCollection(seed,dbCol){
  let cache=new Map(seed.map(x=>[x.id,x]));
  let ready=!dbCol;
  const listeners=new Set();
  function notify(){const arr=[...cache.values()];listeners.forEach(fn=>fn(arr));}
  if(dbCol){
    dbCol.get().then(snap=>{
      if(snap.empty){
        return Promise.all(seed.map(item=>{const d=Object.assign({},item);delete d.id;return dbCol.doc(item.id).set(d);})).catch(()=>{});
      }
    }).catch(()=>{}).finally(()=>{
      dbCol.onSnapshot(snap=>{
        cache=new Map(snap.docs.map(d=>[d.id,Object.assign({id:d.id},d.data())]));
        ready=true;notify();
      },()=>{});
    });
  }
  return {
    subscribe(fn){listeners.add(fn);if(ready)fn([...cache.values()]);return()=>listeners.delete(fn);},
    all(){return [...cache.values()];},
    async add(data){
      const id=data.id||uid('id');const body=Object.assign({},data);delete body.id;
      if(dbCol){await dbCol.doc(id).set(body);}else{cache.set(id,Object.assign({id},body));notify();}
      return id;
    },
    async update(id,data){
      if(dbCol){await dbCol.doc(id).update(data).catch(async()=>{await dbCol.doc(id).set(data);});}
      else{const cur=cache.get(id)||{id};cache.set(id,Object.assign({},cur,data));notify();}
    },
    async remove(id){
      if(dbCol){await dbCol.doc(id).delete();}else{cache.delete(id);notify();}
    }
  };
}

async function init(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth();
  const fsdb=firebase.firestore();
  S.auth=auth; S.fsdb=fsdb;

  store.members=makeCollection(SEED_MEMBERS, fsdb.collection('members'));
  store.tasks=makeCollection(SEED_TASKS, fsdb.collection('tasks'));
  store.vacations=makeCollection(SEED_VACATIONS, fsdb.collection('vacations'));
  store.externals=makeCollection(SEED_EXTERNAL, fsdb.collection('externalWorks'));
  store.holidays=makeCollection(SEED_HOLIDAYS, fsdb.collection('holidays'));
  store.scrum=makeCollection(SEED_SCRUM, fsdb.collection('scrum'));

  store.members.subscribe(v=>{S.members=v.slice().sort((a,b)=>(a.order||0)-(b.order||0));onDataChange();});
  store.tasks.subscribe(v=>{S.tasks=v;onDataChange();});
  store.vacations.subscribe(v=>{S.vacations=v;onDataChange();});
  store.externals.subscribe(v=>{S.externals=v;onDataChange();});
  store.holidays.subscribe(v=>{S.holidays=v;onDataChange();});
  store.scrum.subscribe(v=>{S.scrum=v;onDataChange();});

  wireLogin();
  wireApp();

  auth.onAuthStateChanged(async user=>{
    if(!user){
      S.pendingUid=null; S.me=null;
      showLoginScreen();
      return;
    }
    S.pendingUid=user.uid;
    try{
      const ref=fsdb.collection('members').doc(user.uid);
      const snap=await ref.get();
      if(!snap.exists){
        const countSnap=await fsdb.collection('members').get();
        const isFirst=countSnap.empty;
        await ref.set({
          name:user.displayName||(user.email||'').split('@')[0],
          email:(user.email||'').toLowerCase(),
          role:isFirst?'admin':'editor',
          team:'',
          order:countSnap.size
        });
      }
    }catch(e){ console.error('프로필 생성 실패',e); }
    tryEnterFromPending();
  });
}
function tryEnterFromPending(){
  if(!S.pendingUid) return;
  const m=memberById(S.pendingUid);
  if(m) enterApp(m);
}

  if(document.getElementById('app').hidden){

  populateMemberFilter();

  if(S.me){const fresh=memberById(S.me.id); if(fresh) S.me=fresh;}
  renderMe();
}

function wireLogin(){
  document.getElementById('pwToggleBtn').addEventListener('click',()=>{
    const inp=document.getElementById('loginPw');
    const btn=document.getElementById('pwToggleBtn');
    if(inp.type==='password'){inp.type='text';btn.textContent='숨김';}else{inp.type='password';btn.textContent='표시';}
  });
  document.getElementById('modeToggleBtn').addEventListener('click',e=>{
    e.preventDefault();
    setLoginMode(loginMode==='signup'?'login':'signup');
  });
  document.getElementById('forgotPwBtn').addEventListener('click',async e=>{
    e.preventDefault();
    const email=document.getElementById('loginEmail').value.trim();
    if(!email){ showLoginErr('비밀번호를 재설정할 이메일을 먼저 입력해 주세요.'); return; }
    try{ await S.auth.sendPasswordResetEmail(email); toast('재설정 메일을 보냈습니다. 메일함을 확인해 주세요.'); document.getElementById('loginErr').hidden=true; }
    catch(err){ showLoginErr(authErrMsg(err)); }
  });
  document.getElementById('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const email=document.getElementById('loginEmail').value.trim().toLowerCase();
    const pw=document.getElementById('loginPw').value;
    const name=document.getElementById('loginName').value.trim();
    const btn=document.getElementById('loginSubmitBtn');
    btn.disabled=true;
    try{
      if(loginMode==='signup'){
        if(!name){ showLoginErr('이름을 입력해 주세요.'); btn.disabled=false; return; }
        const cred=await S.auth.createUserWithEmailAndPassword(email,pw);
        await cred.user.updateProfile({displayName:name}).catch(()=>{});
      } else {
        await S.auth.signInWithEmailAndPassword(email,pw);
      }
      document.getElementById('loginErr').hidden=true;
    }catch(err){ showLoginErr(authErrMsg(err)); }
    btn.disabled=false;
  });
}

function throttle(fn,ms){let t=0;return(...a)=>{const now=Date.now();if(now-t>ms){t=now;fn(...a);}};}

/* ---------------- timeline ---------------- */
let dayWidth=64;
function visibleMemberIds(){return S.memberFilter==='all'?S.members.map(m=>m.id):[S.memberFilter];}

function computeDayWidth(){
  if(S.zoom==='week'){
    /* 1주 보기: 스크롤 없이 컨테이너 너비에 꽉 차게 가변 확장 */
    const viewport=document.getElementById('tlScroll').clientWidth||360;
    dayWidth=clamp(Math.floor(viewport/7),80,220);
  } else {
    /* 2주 보기: 고정 폭 - 컨테이너보다 넓어지면 가로 스크롤 */
    dayWidth=92;
  }
}

function renderTimeline(){
  if(document.getElementById('app').hidden) return;
  computeDayWidth();
  const inner=document.getElementById('tlInner');
  const nDays=viewLength();
  const winStart=S.windowStart;
  const winEnd=addDays(winStart,nDays-1);
  const width=nDays*dayWidth;
  const filterIds=new Set(visibleMemberIds());
  document.getElementById('rangeLabel').textContent=kDate(winStart)+' – '+kDate(winEnd);

  // clip a [start,end] range (strings) to the visible window; null if no overlap
  function clipToWindow(startStr,endStr){
    const s=parse(startStr), e=parse(endStr);
    const cs = s<winStart?winStart:s;
    const ce = e>winEnd?winEnd:e;
    if(ce<cs || e<winStart || s>winEnd) return null;
    return {cs,ce,clippedStart:s<winStart,clippedEnd:e>winEnd};
  }

  const fixedItems=[];
  S.vacations.forEach(v=>{ if(filterIds.has(v.memberId)){ const c=clipToWindow(v.start,v.end); if(c) fixedItems.push({type:'vac',c,color:colorFor(v.memberId),label:''+icon('palmtree',16)+''+((memberById(v.memberId)||{}).name||'')+' 휴가'+(v.half==='am'?' · 오전 반차':v.half==='pm'?' · 오후 반차':'')+(v.note?' · '+v.note:''),data:v}); } });
  S.externals.forEach(x=>{ if(x.memberIds.some(id=>filterIds.has(id))){ const c=clipToWindow(x.start,x.end); if(c) fixedItems.push({type:'ext',c,color:colorFor(x.memberIds[0]||x.id),label:''+icon('briefcase',16)+''+x.title+' · '+x.memberIds.map(id=>(memberById(id)||{}).name).filter(Boolean).join(', '),data:x}); } });

  const taskItems=[];
  if(S.density==='full'){
    S.tasks.forEach(t=>{
      const assignees=[t.uxAssignee,...(t.designAssignees||[])].filter(Boolean);
      if(assignees.length && !assignees.some(id=>filterIds.has(id))) return;
      const c=clipToWindow(t.start,t.end); if(c) taskItems.push({c,data:t});
    });
  }

  let html='';
  html+='<div class="tlHeaderRow" style="width:'+width+'px">';
  for(let i=0;i<nDays;i++){
    const d=addDays(winStart,i);
    const ds=fmt(d);
    const hol=holidayOn(ds);
    const isWknd=(d.getDay()===0||d.getDay()===6);
    const isToday=dayDiff(TODAY,d)===0;
    html+='<div class="tlDayHead'+(isWknd?' weekend':'')+(hol?' holiday':'')+(isToday?' today':'')+'" data-date="'+ds+'" style="width:'+dayWidth+'px">'
      +'<span class="dow">'+DOW[d.getDay()]+'</span><span class="dnum">'+(isToday?'<span class="dnumBadge">'+d.getDate()+'</span>':d.getDate())+'</span>'
      +(hol?'<span class="hname" title="'+esc(hol.name)+'">'+esc(hol.name)+'</span>':'')
      +'</div>';
  }
  html+='</div>';

  html+='<div class="tlBody" style="width:'+width+'px;">';
  for(let i=0;i<nDays;i++){
    const d=addDays(winStart,i);
    const ds=fmt(d);
    const hol=holidayOn(ds);
    const isWknd=(d.getDay()===0||d.getDay()===6);
    if(hol||isWknd) html+='<div class="tlBg '+(hol?'holiday':'weekend')+'" style="left:'+(i*dayWidth)+'px;width:'+dayWidth+'px;"></div>';
  }
  if(TODAY>=winStart && TODAY<=winEnd){
    const todayIdx=dayDiff(winStart,TODAY);
    html+='<div class="tlToday" style="left:'+(todayIdx*dayWidth)+'px;"></div>';
  }

  let rowH=54, gap=6;
  const vacTop=10, vacH=28;
  const taskTop=vacTop+vacH+14;
  if(fixedItems.length){
    fixedItems.forEach(it=>{
      const left=dayDiff(winStart,it.c.cs)*dayWidth+2;
      const w=Math.max(dayWidth-4,(dayDiff(it.c.cs,it.c.ce)+1)*dayWidth-4);
      html+='<div class="bar '+it.type+'" data-kind="'+it.type+'" data-id="'+it.data.id+'" style="left:'+left+'px;top:'+vacTop+'px;height:'+vacH+'px;width:'+w+'px;border-color:'+it.color+';color:'+it.color+';">'+it.label+'</div>';
    });
  }
  let taskRows=1;
  if(S.density==='full'){
    if(taskItems.length===0){
      html+='<div style="position:absolute;top:'+taskTop+'px;left:12px;color:var(--text-faint);font-size:11.5px;">표시할 과제가 없습니다.</div>';
    } else {
      taskRows=taskItems.length;
      taskItems.forEach((it,idx)=>{
        const t=it.data;
        const left=dayDiff(winStart,it.c.cs)*dayWidth+2;
        const w=Math.max(dayWidth-4,(dayDiff(it.c.cs,it.c.ce)+1)*dayWidth-4);
        const top=taskTop+idx*(rowH+gap);
        const catTag=t.category?'<span class="tlBarCat">'+esc(t.category)+'</span>':'';
        const uxTxt=esc((memberById(t.uxAssignee)||{}).name||'미정');
        const desNames=(t.designAssignees||[]).map(id=>(memberById(id)||{}).name).filter(Boolean);
        const desTxt=esc(desNames.length?desNames.join(', '):'미정');
        const ticketTxt=t.ticket?esc(t.ticket):'';
        const cnt=(t.subtasks&&t.subtasks.length)?t.subtasks.length+'개':'';
        const metaParts=['UX '+uxTxt,'Design '+desTxt];
        if(ticketTxt) metaParts.push(ticketTxt);
        metaParts.push(t.progress+'%');
        if(cnt) metaParts.push(cnt);
        html+='<div class="bar task'+(t.status==='closed'?' closed':'')+'" data-kind="task" data-id="'+t.id+'" style="left:'+left+'px;top:'+top+'px;height:'+rowH+'px;width:'+w+'px;">'
          +'<div class="tlBarTop">'+(it.c.clippedStart?'':'<span class="code">'+esc(t.code)+'</span>')+catTag+'<span class="lbl">'+esc(t.title)+'</span></div>'
          +'<div class="tlBarMeta">'+metaParts.join(' · ')+'</div>'
          +'</div>';
      });
    }
  } else { taskRows=0; html+='<div style="position:absolute;top:'+taskTop+'px;left:12px;color:var(--text-faint);font-size:11.5px;">요약 보기에서는 과제 트랙이 숨겨집니다.</div>'; }
  const bodyH=Math.max(taskTop+taskRows*(rowH+gap)+16, Math.round(window.innerHeight*0.5));
  html+='</div>';
  inner.innerHTML=html;
  inner.style.height=bodyH+'px';
  inner.querySelector('.tlBody').style.height=bodyH+'px';

  inner.querySelectorAll('.tlDayHead').forEach(el=>{
    el.addEventListener('click',()=>{S.scrumDate=el.dataset.date;renderScrum();});
  });
  inner.querySelectorAll('.bar').forEach(el=>{
    el.addEventListener('click',()=>{
      const kind=el.dataset.kind,id=el.dataset.id;
      if(kind==='task') openTaskDetail(id);
      else if(kind==='vac') openVacationForm(S.vacations.find(v=>v.id===id));
      else if(kind==='ext') openExternalForm(S.externals.find(x=>x.id===id));
    });
  });

}

/* ---------------- scrum board ---------------- */
function renderScrum(){
  if(document.getElementById('app').hidden) return;
  const d=parse(S.scrumDate);
  document.getElementById('scrumTitle').textContent=kDateDow(d)+' 스크럼';
  const filterIds=new Set(visibleMemberIds());
  const members=S.members.filter(m=>filterIds.has(m.id));
  const entriesByMember=new Map();
  S.scrum.filter(s=>s.date===S.scrumDate).forEach(s=>entriesByMember.set(s.memberId,s));

  const pending=members.filter(m=>!entriesByMember.has(m.id));
  const done=members.filter(m=>entriesByMember.has(m.id));
  document.getElementById('scrumCnt').textContent='구성원 '+members.length+'명 중 '+done.length+'명 작성 완료';

  const pendingEl=document.getElementById('pendingList');
  pendingEl.innerHTML = pending.length? pending.map(m=>
    '<div class="card pendingCard"><div class="cHead"><span class="avatar" style="background:'+colorFor(m.id)+'">'+initials(m.name)+'</span><b>'+esc(m.name)+'</b><span class="role">'+esc(m.team||'')+'</span></div>'
    +(S.me?'<button class="pendingWriteBox" data-write="'+m.id+'">+ '+(S.me.id===m.id?'스크럼 작성':esc(m.name)+'님 대신 작성')+'</button>':'')
    +'</div>').join('') : '<div class="scrumEmpty">해당 카드가 없습니다.</div>';
  pendingEl.querySelectorAll('[data-write]').forEach(b=>b.addEventListener('click',()=>openScrumEditor(b.dataset.write,null)));

  const doneEl=document.getElementById('doneList');
  doneEl.innerHTML = done.length? done.map(m=>{
    const entry=entriesByMember.get(m.id);
    const itemsHtml=(entry.items||[]).map(it=>{
      const t=taskById(it.taskId);
      const prio=it.priority?('<span class="prio '+it.priority+'">'+({p1:'우선순위 1',p2:'우선순위 2',p3:'우선순위 3'}[it.priority]||'')+'</span>'):'';
      const cat=t&&t.category?'<span class="cat">'+esc(t.category)+'</span>':'';
      const ticketNo=t&&t.ticket?'<span class="ticketNo">'+esc(t.ticket)+'</span>':'';
      const tasks=t?taskTasksOf(t):[];
      const tasksHtml=tasks.length?('<div class="taskGroup">'+tasks.map(tk=>{
        const todos=tk.todos||[];
        const single=todos.length===1 && todos[0].title===tk.title;
        const todosHtml=(!single && todos.length)?todos.map(td=>{
          const tdPrio=td.priority?'<span class="prio '+td.priority+'">'+({p1:'P1',p2:'P2',p3:'P3'}[td.priority]||'')+'</span>':'';
          return '<div class="todoRow"><span class="todoArrow">└</span><span class="todoTitle">'+esc(td.title)+'</span>'+tdPrio+'<span class="todoProg">'+(td.progress||0)+'%</span></div>';
        }).join(''):'';
        const soleProg=single?('<span class="todoProg">'+(todos[0].progress||0)+'%</span>'):'';
        return '<div class="taskRow">'+icon('clipboardList',12)+'<span class="taskTitle">'+esc(tk.title)+'</span>'+soleProg+'</div>'+todosHtml;
      }).join('')+'</div>'):'';
      return '<div class="item"><div class="taskLine">'+(t?'<span class="code">'+esc(t.code)+'</span>'+esc(t.title):'<span>기타</span>')+cat+ticketNo+prio+'</div>'
        +(it.note?'<div class="note">'+esc(it.note)+'</div>':'')
        +tasksHtml
        +(it.link?'<div style="margin-top:5px;"><a class="outlink" target="_blank" rel="noopener" href="'+esc(it.link)+'">산출물 링크 '+icon('externalLink',12)+'</a></div>':'')
        +'</div>';
    }).join('') || '<div class="note">작성된 항목이 없습니다.</div>';
    const reviewHtml=(entry.reviewRequests&&entry.reviewRequests.length)?('<div class="reviewList">'+entry.reviewRequests.map(r=>{
      const rm=memberById(r.mentionId);
      const dLabel=r.date?(Number(r.date.slice(5,7))+'.'+Number(r.date.slice(8,10))):'';
      return '<div class="reviewRow"><span class="rTag">리뷰 대기</span><span class="rText">'+esc(r.text||'')+'</span>'+(rm?'<span class="rTo">'+icon('arrowRight',12)+' @'+esc(rm.name)+'</span>':'')+(dLabel?'<span class="rDate">'+dLabel+'</span>':'')+'</div>';
    }).join('')+'</div>'):'';
    const canEdit=S.me && (S.me.id===m.id || isAdmin());
    return '<div class="card"><div class="cHead"><span class="avatar" style="background:'+colorFor(m.id)+'">'+initials(m.name)+'</span><b>'+esc(m.name)+'</b><span class="role">'+esc(m.team||'')+'</span>'
      +(canEdit?'<button class="more" data-more="'+m.id+'" title="더보기">'+icon('ellipsis',16)+'</button>':'')+'</div>'+itemsHtml+reviewHtml+'</div>';
  }).join('') : '<div class="scrumEmpty">해당 카드가 없습니다.</div>';
  doneEl.querySelectorAll('[data-more]').forEach(b=>b.addEventListener('click',()=>{
    const mid=b.dataset.more; const entry=entriesByMember.get(mid);
    openScrumEditor(mid,entry);
  }));
}

/* ---------------- tasks table ---------------- */
let taskViewMode='card';
function genId(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
/* Task(=subtasks 항목) 및 그 하위 To-do 목록을 정규화해서 반환. 구버전 {title,progress} 데이터도 todos 1개짜리로 변환해 호환. */
function taskTasksOf(t){
  return (t.subtasks||[]).map(s=>({
    id: s.id || genId('tk'),
    title: s.title||'',
    todos: (s.todos && s.todos.length) ? s.todos.map(td=>({id:td.id||genId('td'), title:td.title||'', progress:td.progress||0, priority:td.priority||''})) : [{id:genId('td'), title:s.title||'', progress:s.progress||0, priority:''}]
  }));
}
function taskItemProgress(tk){
  const list=tk.todos||[];
  if(!list.length) return 0;
  return Math.round(list.reduce((a,b)=>a+(b.progress||0),0)/list.length);
}
function taskUnitsOf(t){
  return taskTasksOf(t).map(tk=>({title:tk.title, progress:taskItemProgress(tk)}));
}
function renderTasks(){
  if(document.getElementById('app').hidden) return;
  const filterIds=new Set(visibleMemberIds());
  const rows=S.tasks.filter(t=>{
    const assignees=[t.uxAssignee,...(t.designAssignees||[])].filter(Boolean);
    return assignees.length===0 || assignees.some(id=>filterIds.has(id));
  }).slice().sort((a,b)=>parse(b.start)-parse(a.start));
  document.getElementById('taskCnt').textContent=rows.length+'건';

  const remaining=rows.filter(t=>t.status!=='closed').length;
  let inProgress=0, overdue=0, dueSoon=0, noProgress=0;
  rows.forEach(t=>{
    const units=taskUnitsOf(t);
    if(units.length){
      if(t.status!=='closed') units.forEach(u=>{ if(u.progress<100) inProgress++; });
    }else if(t.status!=='closed' && (t.progress||0)<100){
      inProgress++;
    }
    if(t.status!=='closed'){
      const end=parse(t.end);
      if(end<TODAY) overdue++;
      else if(end<=addDays(TODAY,7)) dueSoon++;
    }
    if(!units.length && !((t.progress||0)>0)) noProgress++;
  });
  const stats=[
    ['총 티켓',rows.length,true],
    ['잔여 티켓',remaining,false],
    ['진행 중 Task',inProgress,false],
    ['지연 Task',overdue,false],
    ['7일 내 마감',dueSoon,false],
    ['진행률 미입력',noProgress,false]
  ];
  document.getElementById('taskStats').innerHTML=stats.map(s=>'<div class="tsBox'+(s[2]?' active':'')+'"><div class="tsLabel">'+esc(s[0])+'</div><div class="tsNum">'+s[1]+'</div></div>').join('');

  const cardView=document.getElementById('taskCardView');
  const listView=document.getElementById('taskListRows');
  cardView.innerHTML = rows.length? rows.map(t=>{
    const ux=memberById(t.uxAssignee);
    const dz=(t.designAssignees||[]).map(id=>memberById(id)).filter(Boolean).map(m=>m.name).join(', ');
    const units=taskUnitsOf(t);
    const closed=t.status==='closed';
    const body = units.length ? (
      '<div class="tcProgRow"><div class="progBar"><i style="width:'+t.progress+'%"></i></div><span class="progNum">'+t.progress+'%</span></div>'
      +'<div class="tcSubList">'+units.map((u,i)=>{
        const checked=u.progress>=100;
        return '<div class="tcSub"><div class="tcSubTop"><span class="tcSubCheck'+(checked?' checked':'')+'">'+(checked?icon('check',10):'')+'</span><span class="tcSubIdx">'+String(i+1).padStart(2,'0')+'</span><span class="tcSubTitle">'+esc(u.title||'')+'</span></div><div class="progBar"><i style="width:'+u.progress+'%"></i></div><span class="progNum">'+u.progress+'%</span></div>';
      }).join('')+'</div>'
    ) : '<div class="tcEmpty">하위 Task가 없습니다.</div>';
    return '<div class="taskCard'+(closed?' isClosed':'')+'">'
      +'<div class="tcHead"><span class="tCode">'+esc(t.code)+'</span><span class="tcTitle">'+esc(t.title)+'</span>'
      +(closed?'<span class="tStatus closed">종료</span>':'')
      +(t.category?'<span class="tCat">'+esc(t.category)+'</span>':'')
      +(t.ticket?'<span class="ticketNo">'+esc(t.ticket)+'</span>':'')
      +'<span class="tlDate">'+esc(t.start)+' ~ '+esc(t.end)+'</span>'
      +'<span class="tcActions"><button data-edit="'+t.id+'" title="수정">'+icon('pencil')+'</button><button data-del="'+t.id+'" title="삭제">'+icon('trash')+'</button></span>'
      +'</div>'
      +'<div class="tcAssignees">UX '+(ux?esc(ux.name):'미정')+'&nbsp;&nbsp;Design '+(dz?esc(dz):'미정')+'</div>'
      +body
      +'</div>';
  }).join('') : '<div class="scrumEmpty">과제가 없습니다.</div>';

  listView.innerHTML = rows.length? rows.map(t=>{
    const ux=memberById(t.uxAssignee);
    const dz=(t.designAssignees||[]).map(id=>memberById(id)).filter(Boolean).map(m=>m.name).join(', ');
    const units=taskUnitsOf(t);
    const closed=t.status==='closed';
    const progText = (units.length || (t.progress||0)>0) ? '진행률 '+t.progress+'%' : '진행률 미입력';
    return '<div class="tlRow'+(closed?' isClosed':'')+'">'
      +'<div class="tlLeft">'
        +'<div class="tlTitleLine"><span class="tCode">'+esc(t.code)+'</span><span>'+esc(t.title)+'</span>'+(closed?'<span class="tStatus closed">종료</span>':'')+'</div>'
        +'<div class="tlMetaLine">'
          +(t.category?'<span class="tCat">'+esc(t.category)+'</span>':'')
          +(t.ticket?'<span class="ticketNo">'+esc(t.ticket)+'</span>':'')
          +'<span>'+esc(t.start)+' ~ '+esc(t.end)+'</span>'
          +'<span>UX '+(ux?esc(ux.name):'미정')+' &nbsp;Design '+(dz?esc(dz):'미정')+'</span>'
        +'</div>'
      +'</div>'
      +'<div class="tlRight"><b>Task '+units.length+'개</b><span>'+progText+'</span><span class="tlActions"><button data-edit="'+t.id+'" title="수정">'+icon('pencil')+'</button><button data-del="'+t.id+'" title="삭제">'+icon('trash')+'</button></span></div>'
      +'</div>';
  }).join('') : '<div class="scrumEmpty">과제가 없습니다.</div>';

  document.querySelectorAll('#taskCardView [data-edit], #taskListRows [data-edit]').forEach(b=>b.addEventListener('click',()=>openTaskForm(taskById(b.dataset.edit))));
  document.querySelectorAll('#taskCardView [data-del], #taskListRows [data-del]').forEach(b=>b.addEventListener('click',()=>{
    if(confirm('이 과제를 삭제할까요?')) store.tasks.remove(b.dataset.del).then(()=>toast('과제를 삭제했습니다.'));
  }));
}

function openTaskDetail(id){
  const t=taskById(id); if(!t)return;
  const ux=memberById(t.uxAssignee);
  const dz=(t.designAssignees||[]).map(mid=>memberById(mid)).filter(Boolean).map(m=>m.name).join(', ');
  const subs=(t.subtasks||[]).map(s=>'<div class="item"><div class="taskLine">'+esc(s.title)+'</div><div class="metaRow"><div class="progBar"><i style="width:'+(s.progress||0)+'%"></i></div><span class="progNum">'+(s.progress||0)+'%</span></div></div>').join('')||'<div class="note">하위 작업이 없습니다.</div>';
  openModal('<button class="modalClose" onclick="window.__closeModal()">'+icon('x')+'</button>'
    +'<h3><span class="tCode">'+esc(t.code)+'</span> '+esc(t.title)+'</h3>'
    +'<p class="desc">'+(t.category||'-')+' · '+t.start+' ~ '+t.end+' · '+(t.ticket||'티켓 없음')+'</p>'
    +'<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;"><div class="progBar" style="height:8px;"><i style="width:'+t.progress+'%"></i></div><span class="progNum">'+t.progress+'%</span></div>'
    +'<p style="font-size:12.5px;color:var(--text-muted);margin:0 0 10px;">UX '+(ux?esc(ux.name):'미정')+(dz?' · Design '+esc(dz):'')+'</p>'
    +subs
    +'<div class="modalActions"><button class="btnGhost" onclick="window.__closeModal()">닫기</button><button class="btnPrimary" style="width:auto;" id="editFromDetail">수정</button></div>',
    root=>{ window.__closeModal=closeModal; root.querySelector('#editFromDetail').addEventListener('click',()=>{closeModal();openTaskForm(t);}); });
}

/* -------- scrum editor -------- */
function openScrumEditor(memberId,entry){
  const member=memberById(memberId);
  const items=(entry&&entry.items&&entry.items.length)?JSON.parse(JSON.stringify(entry.items)).map(it=>({taskId:it.taskId||'',link:it.link||'',note:it.note||''})).filter(it=>it.taskId&&taskById(it.taskId)):[];
  const reviews=(entry&&entry.reviewRequests&&entry.reviewRequests.length)?JSON.parse(JSON.stringify(entry.reviewRequests)):[];
  const canEdit=S.me && (S.me.id===memberId || isAdmin() || !entry);
  /* 티켓별 Task/To-do 작업 드래프트: taskId -> [{id,title,todos:[{id,title,progress,priority}]}] */
  const draft={};
  function ensureDraft(taskId){
    if(!taskId) return [];
    if(!draft[taskId]){
      const t=taskById(taskId);
      draft[taskId]=t?taskTasksOf(t):[];
    }
    return draft[taskId];
  }
  function persistDraft(taskId){
    if(!draft[taskId]) return;
    store.tasks.update(taskId,{subtasks:draft[taskId]}).catch(()=>toast('저장 중 오류가 발생했습니다.'));
  }
  function taskBlockHtml(taskId,tk,tIdx){
    const todos=tk.todos||[];
    const todosHtml=todos.map((td,ddx)=>{
      return '<div class="todoRow2">'
        +'<span class="todoTitle2">'+esc(td.title)+'</span>'
        +'<select class="todoProgSel" data-todoprog="1" data-tid="'+taskId+'" data-tidx="'+tIdx+'" data-ddx="'+ddx+'">'
        +[0,10,25,50,75,90,100].map(p=>'<option value="'+p+'" '+(Number(td.progress||0)===p?'selected':'')+'>'+p+'%</option>').join('')
        +'</select>'
        +'<button type="button" class="todoRmBtn" data-todorm="1" data-tid="'+taskId+'" data-tidx="'+tIdx+'" data-ddx="'+ddx+'">'+icon('x',12)+'</button>'
        +'</div>';
    }).join('');
    return '<div class="taskBlock">'
      +'<div class="taskBlockHead"><span class="taskBlockTitle">'+esc(tk.title||'(제목 없음)')+'</span>'
      +'<button type="button" class="taskEditBtn" data-taskedit="1" data-tid="'+taskId+'" data-tidx="'+tIdx+'" title="이름 수정">'+icon('pencil',12)+'</button>'
      +'<button type="button" class="taskRmBtn" data-taskrm="1" data-tid="'+taskId+'" data-tidx="'+tIdx+'" title="Task 삭제">'+icon('x',12)+'</button>'
      +'</div>'
      +'<div class="todoSection"><div class="todoLabel">To-do</div>'
      +'<div class="todoListHost">'+todosHtml+'</div>'
      +'<div class="todoAddRow">'
      +'<input type="text" class="todoNewInput" data-tid="'+taskId+'" data-tidx="'+tIdx+'" placeholder="새 To-do">'
      +'<select class="todoNewPrio" data-tid="'+taskId+'" data-tidx="'+tIdx+'"><option value="">우선순위 없음</option><option value="p1">우선순위 1</option><option value="p2">우선순위 2</option><option value="p3">우선순위 3</option></select>'
      +'<button type="button" class="todoAddBtn" data-todoadd="1" data-tid="'+taskId+'" data-tidx="'+tIdx+'">추가</button>'
      +'</div>'
      +'<div class="todoHint">추가하면 Task에 바로 저장됩니다. 스크럼 작성을 취소해도 To-do는 남습니다.</div>'
      +'</div></div>';
  }
  function itemHtml(it,idx){
    const t=taskById(it.taskId);
    if(!t) return '';
    const tasks=ensureDraft(it.taskId);
    const ux=memberById(t.uxAssignee);
    const dz=(t.designAssignees||[]).map(id=>memberById(id)).filter(Boolean).map(m=>m.name).join(', ');
    const who=[ux?ux.name:'',dz].filter(Boolean).join(' · ');
    const tasksHtml=tasks.map((tk,tIdx)=>taskBlockHtml(it.taskId,tk,tIdx)).join('');
    return '<div class="itemRow" data-idx="'+idx+'"><div class="itemTicketCard">'
      +'<div class="itHead"><span class="itTicketIcon">'+icon('clipboardList',14)+'</span><span class="code">'+esc(t.code)+'</span><span class="itTicketTitle">'+esc(t.title)+'</span>'+(who?'<span class="itWho">· '+esc(who)+'</span>':'')
      +'<button type="button" class="itRemove" data-rm="'+idx+'" title="제거">'+icon('x',14)+'</button></div>'
      +tasksHtml
      +'<button type="button" class="addTaskBtn" data-taskadd="1" data-tid="'+it.taskId+'">+ Task 추가</button>'
      +'<div class="itLinkRow"><input type="text" class="itLinkInput" data-f="link" data-idx="'+idx+'" placeholder="산출물 링크 (선택)" value="'+esc(it.link||'')+'"></div>'
      +'</div></div>';
  }
  function reviewRowHtml(r,idx){
    const memberOpts='<option value="">멘션할 팀원</option>'+S.members.map(mm=>'<option value="'+mm.id+'" '+(r.mentionId===mm.id?'selected':'')+'>'+esc(mm.name)+'</option>').join('');
    return '<div class="reviewEditRow" data-ridx="'+idx+'">'
      +'<input type="text" data-rf="text" data-ridx="'+idx+'" placeholder="예: 서비스 신청 플로우" value="'+esc(r.text||'')+'">'
      +'<select data-rf="mentionId" data-ridx="'+idx+'">'+memberOpts+'</select>'
      +'<input type="date" data-rf="date" data-ridx="'+idx+'" value="'+esc(r.date||'')+'">'
      +'<button type="button" data-rrm="'+idx+'">'+icon('x')+'</button>'
      +'</div>';
  }
  function render(root){
    root.querySelector('#itemsHost').innerHTML=items.map(itemHtml).join('') || '<div class="scrumEmpty" style="padding:16px 0;">관련 티켓을 추가해주세요.</div>';
    root.querySelector('#reviewHost').innerHTML=reviews.map(reviewRowHtml).join('');
    const addSel=root.querySelector('#addTicketSelect');
    if(addSel){
      const usedIds=new Set(items.map(it=>it.taskId));
      addSel.innerHTML='<option value="">+ 다른 티켓 추가</option>'+S.tasks.filter(tt=>!usedIds.has(tt.id)).map(tt=>'<option value="'+tt.id+'">'+esc(tt.code)+' '+esc(tt.title)+'</option>').join('');
    }
    root.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{items.splice(Number(b.dataset.rm),1);render(root);}));
    root.querySelectorAll('[data-f="link"]').forEach(inp=>inp.addEventListener('input',()=>{
      const idx=Number(inp.dataset.idx); items[idx].link=inp.value;
    }));
    root.querySelectorAll('[data-taskadd]').forEach(b=>b.addEventListener('click',()=>{
      const tid=b.dataset.tid; const tasks=ensureDraft(tid);
      tasks.push({id:genId('tk'),title:'새 Task',todos:[]});
      persistDraft(tid); render(root);
    }));
    root.querySelectorAll('[data-taskedit]').forEach(b=>b.addEventListener('click',()=>{
      const tid=b.dataset.tid, tidx=Number(b.dataset.tidx);
      const tk=draft[tid][tidx];
      const val=prompt('Task 이름을 입력하세요', tk.title);
      if(val!=null){ tk.title=val.trim()||tk.title; persistDraft(tid); render(root); }
    }));
    root.querySelectorAll('[data-taskrm]').forEach(b=>b.addEventListener('click',()=>{
      const tid=b.dataset.tid, tidx=Number(b.dataset.tidx);
      const tasks=draft[tid];
      if(tasks[tidx].todos.length && !confirm('이 Task와 하위 To-do가 모두 삭제됩니다. 계속할까요?')) return;
      tasks.splice(tidx,1); persistDraft(tid); render(root);
    }));
    root.querySelectorAll('[data-todoadd]').forEach(b=>b.addEventListener('click',()=>{
      const tid=b.dataset.tid, tidx=Number(b.dataset.tidx);
      const input=root.querySelector('.todoNewInput[data-tid="'+tid+'"][data-tidx="'+tidx+'"]');
      const prioSel=root.querySelector('.todoNewPrio[data-tid="'+tid+'"][data-tidx="'+tidx+'"]');
      const val=(input.value||'').trim();
      if(!val){ input.focus(); return; }
      const tk=draft[tid][tidx];
      tk.todos=tk.todos||[];
      tk.todos.push({id:genId('td'),title:val,progress:0,priority:prioSel.value||''});
      persistDraft(tid); render(root);
    }));
    root.querySelectorAll('[data-todoprog]').forEach(sel=>sel.addEventListener('change',()=>{
      const tid=sel.dataset.tid, tidx=Number(sel.dataset.tidx), ddx=Number(sel.dataset.ddx);
      draft[tid][tidx].todos[ddx].progress=Number(sel.value);
      persistDraft(tid);
    }));
    root.querySelectorAll('[data-todorm]').forEach(b=>b.addEventListener('click',()=>{
      const tid=b.dataset.tid, tidx=Number(b.dataset.tidx), ddx=Number(b.dataset.ddx);
      draft[tid][tidx].todos.splice(ddx,1);
      persistDraft(tid); render(root);
    }));
    root.querySelectorAll('[data-rf]').forEach(inp=>inp.addEventListener('input',()=>{
      const idx=Number(inp.dataset.ridx),f=inp.dataset.rf;
      reviews[idx][f]=inp.value;
    }));
    root.querySelectorAll('[data-rrm]').forEach(b=>b.addEventListener('click',()=>{reviews.splice(Number(b.dataset.rrm),1);render(root);}));
  }
  const prevDateStr=fmt(addDays(parse(S.scrumDate),-1));
  const prevEntry=S.scrum.find(s=>s.date===prevDateStr && s.memberId===memberId);
  openModal('<button class="modalClose" onclick="window.__closeModal()">'+icon('x')+'</button>'
    +'<h3>'+esc(member.name)+'님의 스크럼</h3><p class="desc">'+kDateDow(parse(S.scrumDate))+'</p>'
    +'<form id="scrumForm">'
    +(canEdit&&prevEntry?'<button type="button" class="loadYesterdayBtn" id="loadYesterday">'+icon('rotateCcw',14)+'어제 작성한 내용 불러오기</button>':'')
    +'<div class="ticketPickLabel">관련 티켓 <span class="req">(필수, 여러 개 선택 가능)</span></div>'
    +(canEdit?'<div class="ticketAddRow"><select id="addTicketSelect"></select><button type="button" class="btnGhost" id="addNewTicket">+ 새 티켓</button></div>':'')
    +'<div id="itemsHost"></div>'
    +'<div class="sectionLabel">리뷰 요청</div>'
    +'<div id="reviewHost"></div>'
    +(canEdit?'<button type="button" class="addReviewBtn" id="addReview">+ 리뷰 요청 추가</button>':'')
    +(canEdit?'<div class="modalActions">'+(entry?'<button type="button" class="btnDanger" id="scrumDel">삭제</button>':'')+'<button type="button" class="btnGhost" onclick="window.__closeModal()">취소</button><button class="btnPrimary" style="width:auto;">제출</button></div>':'<div class="modalActions"><button type="button" class="btnGhost" onclick="window.__closeModal()">닫기</button></div>')
    +'</form>', root=>{
      window.__closeModal=closeModal;
      render(root);
      if(!canEdit){ root.querySelectorAll('#itemsHost select,#itemsHost input,#itemsHost textarea,#itemsHost button,#reviewHost select,#reviewHost input,#reviewHost button,#addTicketSelect,#addNewTicket').forEach(el=>el.disabled=true); }
      root.querySelector('#addTicketSelect')&&root.querySelector('#addTicketSelect').addEventListener('change',e=>{
        const val=e.target.value;
        if(!val) return;
        items.push({taskId:val,link:'',note:''});
        render(root);
      });
      root.querySelector('#addNewTicket')&&root.querySelector('#addNewTicket').addEventListener('click',()=>{
        closeModal();
        openTaskForm(null);
      });
      root.querySelector('#addReview')&&root.querySelector('#addReview').addEventListener('click',()=>{reviews.push({text:'',mentionId:'',date:S.scrumDate});render(root);});
      root.querySelector('#loadYesterday')&&root.querySelector('#loadYesterday').addEventListener('click',()=>{
        if(!prevEntry)return;
        const cloned=JSON.parse(JSON.stringify(prevEntry.items||[])).map(it=>({taskId:it.taskId||'',link:'',note:''})).filter(it=>it.taskId&&taskById(it.taskId));
        items.length=0; items.push.apply(items, cloned);
        toast('어제 작성한 티켓을 불러왔습니다.');
        render(root);
      });
      root.querySelector('#scrumDel')&&root.querySelector('#scrumDel').addEventListener('click',async()=>{
        if(confirm('작성한 스크럼을 삭제할까요?')){await store.scrum.remove(entry.id);toast('삭제했습니다.');closeModal();}
      });
      root.querySelector('#scrumForm').addEventListener('submit',async e=>{
        e.preventDefault();
        if(!canEdit)return;
        if(items.length===0){ toast('관련 티켓을 최소 1개 추가해주세요.'); return; }
        items.forEach(it=>{ if(it.link && !/^https?:\/\//i.test(it.link)) it.link='https://'+it.link; });
        const id=S.scrumDate+'_'+memberId;
        const data={date:S.scrumDate,memberId:memberId,status:'submitted',items:items,reviewRequests:reviews};
        if(entry) await store.scrum.update(id,data); else await store.scrum.add(Object.assign({id:id},data));
        toast('스크럼을 제출했습니다.'); closeModal();
      });
    });
}

/* -------- admin -------- */
function openAdmin(){
  if(!isAdmin())return;
  let tab='members';
  function body(){
    if(tab==='members'){
      return S.members.map(m=>'<div class="adminRow"><span class="avatar" style="background:'+colorFor(m.id)+'">'+initials(m.name)+'</span>'
        +'<div class="info"><div class="n">'+esc(m.name)+' <span style="color:var(--text-faint);font-weight:400;">'+(m.role==='admin'?'· 관리자':'· 편집자')+'</span></div><div class="m">'+esc(m.email)+' · '+(m.team||'-')+'</div></div>'
        +'<div class="rowActions"><button data-medit="'+m.id+'">'+icon('pencil')+'</button>'+(S.members.length>1?'<button data-mdel="'+m.id+'">'+icon('trash')+'</button>':'')+'</div></div>').join('')
        +'<div style="font-size:11.5px;color:var(--text-faint);padding:10px 2px 0;line-height:1.6;">새 팀원은 로그인 화면에서 이메일로 직접 회원가입하면 자동으로 이 목록에 추가돼요. 가입 후 이름·팀·역할은 여기서 조정해 주세요.</div>';
    }
    return S.holidays.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(h=>'<div class="adminRow"><div class="info"><div class="n">'+esc(h.name)+'</div><div class="m">'+h.date+'</div></div>'
      +'<div class="rowActions"><button data-hedit="'+h.id+'">'+icon('pencil')+'</button><button data-hdel="'+h.id+'">'+icon('trash')+'</button></div></div>').join('')
      +'<button class="iconBtn solid" id="addHoliday" style="margin-top:6px;">+ 휴일 추가</button>';
  }
  function wire(root){
    root.querySelectorAll('[data-tabb]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tabb;paint(root);}));
    if(tab==='members'){
      root.querySelectorAll('[data-medit]').forEach(b=>b.addEventListener('click',()=>openMemberForm(memberById(b.dataset.medit))));
      root.querySelectorAll('[data-mdel]').forEach(b=>b.addEventListener('click',()=>{ if(confirm('목록에서 제거할까요? (로그인 계정 자체는 남아 있고, 다시 로그인하면 편집자로 자동 등록돼요)')) store.members.remove(b.dataset.mdel).then(()=>{toast('제거했습니다.');paint(root);}); }));
    } else {
      root.querySelectorAll('[data-hedit]').forEach(b=>b.addEventListener('click',()=>openHolidayForm(S.holidays.find(h=>h.id===b.dataset.hedit))));
      root.querySelectorAll('[data-hdel]').forEach(b=>b.addEventListener('click',()=>{ if(confirm('삭제할까요?')) store.holidays.remove(b.dataset.hdel).then(()=>{toast('삭제했습니다.');paint(root);}); }));
      root.querySelector('#addHoliday')&&root.querySelector('#addHoliday').addEventListener('click',()=>openHolidayForm(null));
    }
  }
  function paint(root){
    root.querySelector('#adminBody').innerHTML=body();
    root.querySelectorAll('.adminTabs button').forEach(b=>b.classList.toggle('active',b.dataset.tabb===tab));
    wire(root);
  }
  openModal('<button class="modalClose" onclick="window.__closeModal()">'+icon('x')+'</button><h3>관리</h3><p class="desc">구성원과 공휴일을 관리합니다.</p>'
    +'<div class="adminTabs" style="padding:0 0 10px;"><button data-tabb="members" class="active">구성원</button><button data-tabb="holidays">공휴일</button></div>'
    +'<div id="adminBody"></div>', root=>{ window.__closeModal=closeModal; paint(root); });
}
function openMemberForm(m){
  if(!m)return;
  openModal('<button class="modalClose" onclick="window.__closeModal()">'+icon('x')+'</button><h3>구성원 수정</h3><p class="desc">이메일·비밀번호는 본인이 로그인 화면에서만 바꿀 수 있어요.</p>'
    +'<form id="memForm"><div class="formGrid">'
    +field('이름','name',m.name,'text')
    +'<div class="field2"><label>이메일</label><input value="'+esc(m.email)+'" disabled></div>'
    +'<div class="field2"><label>팀</label><select name="team"><option value="" '+(!m.team?'selected':'')+'>미지정</option><option value="UX" '+(m.team==='UX'?'selected':'')+'>UX</option><option value="Design" '+(m.team==='Design'?'selected':'')+'>Design</option><option value="PM" '+(m.team==='PM'?'selected':'')+'>PM</option></select></div>'
    +'<div class="field2"><label>역할</label><select name="role"><option value="editor" '+(m.role==='editor'?'selected':'')+'>편집자</option><option value="admin" '+(m.role==='admin'?'selected':'')+'>관리자</option></select></div>'
    +'</div><div class="modalActions"><button type="button" class="btnDanger" id="memDel">목록에서 제거</button><button type="button" class="btnGhost" onclick="window.__closeModal()">취소</button><button class="btnPrimary" style="width:auto;">저장</button></div></form>',
    root=>{ window.__closeModal=closeModal;
      root.querySelector('#memDel').addEventListener('click',()=>{
        if(confirm('목록에서 제거할까요? (로그인 계정 자체는 남아 있고, 다시 로그인하면 편집자로 자동 등록돼요)')) store.members.remove(m.id).then(()=>{toast('제거했습니다.');closeModal();});
      });
      root.querySelector('#memForm').addEventListener('submit',async e=>{
        e.preventDefault(); const f=new FormData(e.target);
        const data={name:f.get('name'),team:f.get('team'),role:f.get('role')};
        await store.members.update(m.id,data);
        toast('저장했습니다.'); closeModal(); openAdmin();
      });
    });
}
function openHolidayForm(h){
  const isEdit=!!h;
  h=h||{id:null,date:fmt(TODAY),name:''};
  openModal('<button class="modalClose" onclick="window.__closeModal()">'+icon('x')+'</button><h3>'+(isEdit?'휴일 수정':'휴일 추가')+'</h3>'
    +'<form id="holForm"><div class="formGrid">'+field('날짜','date',h.date,'date')+field('이름','name',h.name,'text')+'</div>'
    +'<div class="modalActions">'+(isEdit?'<button type="button" class="btnDanger" id="holDel">삭제</button>':'')+'<button type="button" class="btnGhost" onclick="window.__closeModal()">취소</button><button class="btnPrimary" style="width:auto;">저장</button></div></form>',
    root=>{ window.__closeModal=closeModal;
      root.querySelector('#holDel')&&root.querySelector('#holDel').addEventListener('click',()=>{ if(confirm('삭제할까요?')) store.holidays.remove(h.id).then(()=>{toast('삭제했습니다.');closeModal();openAdmin();}); });
      root.querySelector('#holForm').addEventListener('submit',async e=>{
        e.preventDefault(); const f=new FormData(e.target);
        const data={date:f.get('date'),name:f.get('name')};
        if(isEdit) await store.holidays.update(h.id,data); else await store.holidays.add(data);
        toast('저장했습니다.'); closeModal(); openAdmin();
      });
    });
}

/* -------- my account -------- */
function openAccount(){
  const m=S.me; if(!m)return;
  openModal('<button class="modalClose" onclick="window.__closeModal()">'+icon('x')+'</button><h3>내 계정</h3>'
    +'<form id="accForm"><div class="formGrid">'
    +field('이름','name',m.name,'text')+field('새 비밀번호','password','','text','변경 시에만 입력')
    +'<div class="field2 full"><label>이메일</label><input value="'+esc(m.email)+'" disabled></div>'
    +'<div class="field2 full"><label>역할</label><input value="'+(m.role==='admin'?'관리자':'편집자')+'" disabled></div>'
    +'</div><div class="modalActions"><button type="button" class="btnGhost" id="logoutBtn">로그아웃</button><button class="btnPrimary" style="width:auto;">저장</button></div></form>',
    root=>{ window.__closeModal=closeModal;
      root.querySelector('#logoutBtn').addEventListener('click',()=>{closeModal();logout();});
      root.querySelector('#accForm').addEventListener('submit',async e=>{
        e.preventDefault(); const f=new FormData(e.target);
        const newName=f.get('name'); const newPw=f.get('password');
        try{
          if(newName && newName!==m.name){
            await store.members.update(m.id,{name:newName});
            S.auth.currentUser.updateProfile({displayName:newName}).catch(()=>{});
          }
          if(newPw){ await S.auth.currentUser.updatePassword(newPw); }
          S.me=Object.assign({},m,{name:newName||m.name});
          toast('저장했습니다.'); closeModal(); renderMe();
        }catch(err){
          if(err.code==='auth/requires-recent-login'){ toast('보안을 위해 다시 로그인한 뒤 비밀번호를 변경해 주세요.'); }
          else { toast('저장에 실패했습니다: '+(err.message||err.code||'')); }
        }
      });
    });
}

init();
})();
</script>
</body>
</html>
