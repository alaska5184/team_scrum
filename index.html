<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팀 스크럼 스케줄러</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">

<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F7F7F7; --border:#E5E5E5; --border-strong:#D4D4D4;
  --text:#252525; --text-muted:#8A8A8A; --text-faint:#B5B5B5;
  --accent:#343434; --accent-strong:#171717; --accent-soft:#F0F0F0; --accent-contrast:#FAFAFA;
  --success:#189A6C; --success-soft:#E3F7EE; --warning:#C97A12; --warning-soft:#FBF0DA;
  --danger:#E7000B; --danger-soft:#FCEAEA; --info:#2E72D9; --info-soft:#E9F1FD;
  --weekend-bg:#FAFAFA; --holiday-bg:#FCEAEA; --today-line:#E7000B;
  --p1:#E7000B; --p2:#C97A12; --p3:#8A8A8A;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 10px 30px -14px rgba(20,20,20,.18);
  --shadow-sm:0 1px 2px rgba(20,20,20,.06);
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --font-ui:'Pretendard Variable','Pretendard',-apple-system,'system-ui','Segoe UI',Roboto,'Noto Sans KR',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#252525; --surface:#2E2E2E; --surface-2:#333333; --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.2);
    --text:#FAFAFA; --text-muted:#B5B5B5; --text-faint:#8A8A8A;
    --accent:#E5E5E5; --accent-strong:#FFFFFF; --accent-soft:#404040; --accent-contrast:#252525;
    --success:#41CE98; --success-soft:#123528; --warning:#F0AD52; --warning-soft:#3B2C10;
    --danger:#FF6467; --danger-soft:#3C1F1F; --info:#78ABF6; --info-soft:#182B45;
    --weekend-bg:#2A2A2A; --holiday-bg:#3C1F1F; --today-line:#FF6467;
    --p1:#FF6467; --p2:#F0AD52; --p3:#B5B5B5;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#252525; --surface:#2E2E2E; --surface-2:#333333; --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.2);
  --text:#FAFAFA; --text-muted:#B5B5B5; --text-faint:#8A8A8A;
  --accent:#E5E5E5; --accent-strong:#FFFFFF; --accent-soft:#404040; --accent-contrast:#252525;
  --success:#41CE98; --success-soft:#123528; --warning:#F0AD52; --warning-soft:#3B2C10;
  --danger:#FF6467; --danger-soft:#3C1F1F; --info:#78ABF6; --info-soft:#182B45;
  --weekend-bg:#2A2A2A; --holiday-bg:#3C1F1F; --today-line:#FF6467;
  --p1:#FF6467; --p2:#F0AD52; --p3:#B5B5B5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;}
.hidden,[hidden]{display:none!important;}
::-webkit-scrollbar{height:10px;width:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- login ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:
  radial-gradient(1200px 600px at 15% -10%, var(--accent-soft), transparent 60%),
  radial-gradient(900px 500px at 110% 10%, var(--info-soft), transparent 55%), var(--bg);}
.loginCard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:36px 30px 28px;}
.loginMark{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,var(--accent),var(--accent-strong));display:flex;align-items:center;justify-content:center;color:var(--accent-contrast);font-weight:900;font-size:18px;margin-bottom:18px;}
.loginCard h1{font-size:19px;margin:0 0 6px;letter-spacing:-.01em;}
.loginCard p.sub{margin:0 0 24px;color:var(--text-muted);font-size:13px;line-height:1.6;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px;}
.field .inputWrap{position:relative;}
.field input{width:100%;padding:11px 13px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface-2);font-size:14px;color:var(--text);}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
.pwToggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-faint);font-size:12px;padding:6px 8px;border-radius:6px;}
.pwToggle:hover{background:var(--accent-soft);color:var(--accent);}
.btnPrimary{width:100%;padding:12px;border:none;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-contrast);font-weight:700;font-size:14.5px;box-shadow:var(--shadow-sm);}
.btnPrimary:hover{background:var(--accent-strong);}
.loginFoot{margin-top:18px;font-size:12px;color:var(--text-faint);line-height:1.6;text-align:center;}
.loginFoot a{color:var(--accent);}
.demoHint{margin-top:16px;background:var(--accent-soft);color:var(--accent-strong);border-radius:var(--r-sm);padding:10px 12px;font-size:12px;line-height:1.6;font-family:var(--font-mono);}
.loginErr{background:var(--danger-soft);color:var(--danger);font-size:12.5px;border-radius:var(--r-sm);padding:9px 11px;margin-bottom:14px;}

/* ---------- app shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}
header.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:15px;letter-spacing:-.01em;white-space:nowrap;}
.brand .dot{width:9px;height:9px;border-radius:3px;background:linear-gradient(145deg,var(--accent),var(--accent-strong));}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;}
.tabs button{border:none;background:none;padding:7px 15px;border-radius:999px;font-size:13px;font-weight:700;color:var(--text-muted);}
.tabs button.active{background:var(--accent);color:var(--accent-contrast);}
.topbar .spacer{flex:1;}
.selectPill{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--text);}
.iconBtn{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:var(--r-sm);padding:7px 12px;font-size:12.5px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:6px;}
.iconBtn:hover{border-color:var(--accent);color:var(--accent-strong);}
.iconBtn.solid{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);}
.iconBtn.solid:hover{background:var(--accent-strong);}
.avatarBtn{display:flex;align-items:center;gap:8px;border:1px solid var(--border-strong);background:var(--surface-2);border-radius:999px;padding:5px 12px 5px 5px;}
.avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;flex:none;}
.avatarBtn .who{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;}
.avatarBtn .who b{font-size:12px;}
.avatarBtn .who span{font-size:10.5px;color:var(--text-muted);}

main{flex:1;display:flex;flex-direction:column;min-width:0;}

/* ---------- schedule controls ---------- */
.scheduleBar{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--surface);}
.scheduleBar h2{font-size:16px;margin:0;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
.segTabs{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
.segTabs button{border:none;background:none;padding:6px 13px;border-radius:999px;font-size:12px;font-weight:700;color:var(--text-muted);}
.segTabs button.active{background:var(--accent-soft);color:var(--accent-strong);}
.navBtns{display:flex;gap:4px;}
.navBtns button{width:30px;height:30px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface-2);font-size:13px;}
.navBtns button:hover{border-color:var(--accent);color:var(--accent-strong);}

/* ---------- timeline ---------- */
.timelineWrap{position:relative;border-bottom:1px solid var(--border);background:var(--surface);}
.timelineScroll{overflow-x:auto;overflow-y:hidden;position:relative;}
.timelineInner{position:relative;}
.tlHeaderRow{display:flex;position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);}
.tlDayHead{flex:none;text-align:center;padding:8px 2px 7px;font-size:11px;color:var(--text-muted);border-right:1px solid var(--border);cursor:pointer;user-select:none;}
.tlDayHead .dow{display:block;font-weight:700;}
.tlDayHead .dnum{display:block;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:1px;color:var(--text);}
.tlDayHead .hname{display:block;font-size:9px;color:var(--danger);font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tlDayHead.weekend{background:var(--weekend-bg);}
.tlDayHead.holiday{background:var(--holiday-bg);}
.tlDayHead.today{background:var(--accent-soft);}
.tlDayHead.today .dnum{color:var(--accent-strong);}
.tlDayHead:hover{background:var(--accent-soft);}
.tlBg{position:absolute;top:0;bottom:0;pointer-events:none;}
.tlBg.weekend{background:var(--weekend-bg);}
.tlBg.holiday{background:var(--holiday-bg);}
.tlToday{position:absolute;top:0;bottom:0;width:2px;background:var(--today-line);z-index:4;}
.tlSection{position:relative;}
.tlSectionLabel{position:sticky;left:0;z-index:3;display:inline-block;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;margin:8px 0 0 8px;}
.tlBody{position:relative;}
.bar{position:absolute;border-radius:8px;padding:0 9px;display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:visible;box-shadow:var(--shadow-sm);border:1px solid transparent;}
.bar span.lbl{overflow:hidden;text-overflow:ellipsis;}
.bar.vac{background:var(--warning-soft);color:var(--warning);border-color:color-mix(in srgb, var(--warning) 30%, transparent);}
.bar.ext{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb, var(--info) 30%, transparent);}
.bar.task{background:var(--surface);border-color:var(--border-strong);color:var(--text);}
.bar.task .code{font-family:var(--font-mono);font-size:10px;color:var(--accent-strong);background:var(--accent-soft);border-radius:4px;padding:1px 5px;flex:none;}
.bar.task .prog{flex:none;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);}
.bar.task.closed{opacity:.55;}
.bar:hover{filter:brightness(0.98);z-index:6;}
.emptyNote{padding:22px;text-align:center;color:var(--text-faint);font-size:12.5px;}

/* ---------- scrum ---------- */
.scrumHead{padding:20px 16px 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.scrumHead h2{font-size:17px;margin:0;font-weight:900;}
.scrumHead .cnt{font-size:12px;color:var(--text-muted);}
.scrumCols{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 16px 28px;}
@media (max-width:720px){.scrumCols{grid-template-columns:1fr;}}
.scrumCol{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px;min-height:120px;}
.scrumCol h3{margin:2px 6px 10px;font-size:12.5px;font-weight:800;color:var(--text-muted);display:flex;align-items:center;gap:6px;}
.scrumCol h3 .badge{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:1px 8px;font-size:11px;}
.scrumEmpty{color:var(--text-faint);font-size:12px;text-align:center;padding:20px 4px;}
.pendingRow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-md);background:var(--surface);border:1px dashed var(--border-strong);margin-bottom:8px;}
.pendingRow button.writeBtn{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--accent-strong);background:var(--accent-soft);border:none;border-radius:999px;padding:5px 11px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.card .cHead{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.card .cHead b{font-size:13px;}
.card .cHead .role{font-size:10.5px;color:var(--text-faint);border:1px solid var(--border);border-radius:999px;padding:0 7px;}
.card .cHead .more{margin-left:auto;border:none;background:none;color:var(--text-faint);font-size:16px;line-height:1;padding:2px 4px;}
.card .cHead .more:hover{color:var(--accent);}
.item{padding:8px 0;border-top:1px solid var(--border);}
.item:first-of-type{border-top:none;}
.item .taskLine{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;flex-wrap:wrap;}
.item .taskLine .code{font-family:var(--font-mono);font-size:10px;color:var(--accent-strong);background:var(--accent-soft);border-radius:4px;padding:0 5px;}
.item .taskLine .prio{font-size:10px;font-weight:800;border-radius:4px;padding:0 5px;}
.item .prio.p1{background:var(--danger-soft);color:var(--p1);}
.item .prio.p2{background:var(--warning-soft);color:var(--p2);}
.item .prio.p3{background:var(--surface-2);color:var(--p3);}
.item .note{font-size:12px;color:var(--text-muted);margin-top:4px;line-height:1.5;}
.item .metaRow{display:flex;align-items:center;gap:8px;margin-top:6px;}
.progBar{flex:1;height:5px;border-radius:3px;background:var(--border);overflow:hidden;}
.progBar i{display:block;height:100%;background:var(--accent);}
.progNum{font-size:10.5px;color:var(--text-muted);font-family:var(--font-mono);flex:none;}
.item a.outlink{font-size:11px;color:var(--info);text-decoration:none;font-weight:700;}
.item a.outlink:hover{text-decoration:underline;}

/* ---------- task table ---------- */
.taskToolbar{display:flex;align-items:center;gap:10px;padding:14px 16px;flex-wrap:wrap;}
.taskToolbar h2{margin:0;font-size:16px;font-weight:900;}
.tableWrap{overflow-x:auto;padding:0 16px 24px;}
table.tasks{width:100%;border-collapse:collapse;min-width:760px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;}
table.tasks th{text-align:left;font-size:11px;color:var(--text-muted);font-weight:800;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;}
table.tasks td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:top;}
table.tasks tr:last-child td{border-bottom:none;}
table.tasks tr:hover td{background:var(--surface-2);}
.tCode{font-family:var(--font-mono);font-size:11px;color:var(--accent-strong);background:var(--accent-soft);border-radius:4px;padding:1px 6px;}
.tCat{font-size:10px;color:var(--text-muted);border:1px solid var(--border);border-radius:5px;padding:1px 6px;}
.tTitle{font-weight:700;}
.tStatus{font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 9px;display:inline-block;}
.tStatus.ongoing{background:var(--info-soft);color:var(--info);}
.tStatus.closed{background:var(--border);color:var(--text-muted);}
.miniProg{display:flex;align-items:center;gap:6px;min-width:90px;}
.rowActions button{border:none;background:none;color:var(--text-faint);font-size:12px;padding:3px 6px;}
.rowActions button:hover{color:var(--accent);}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,16,26,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0;}
@media (min-width:640px){.overlay{align-items:center;padding:20px;}}
.modal{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));}
@media (min-width:640px){.modal{border-radius:var(--r-lg);}}
.modal h3{margin:0 0 4px;font-size:16.5px;font-weight:900;}
.modal p.desc{margin:0 0 16px;font-size:12.5px;color:var(--text-muted);}
.modalClose{position:sticky;float:right;top:0;border:none;background:var(--surface-2);border-radius:50%;width:28px;height:28px;color:var(--text-muted);font-size:14px;}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.formGrid .full{grid-column:1/-1;}
@media (max-width:420px){.formGrid{grid-template-columns:1fr;}}
.field2{margin-bottom:2px;}
.field2 label{display:block;font-size:11.5px;font-weight:700;color:var(--text-muted);margin-bottom:5px;}
.field2 input,.field2 select,.field2 textarea{width:100%;padding:9px 10px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface-2);font-size:13px;color:var(--text);}
.field2 textarea{resize:vertical;min-height:56px;}
.modalActions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}
.btnGhost{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:var(--r-sm);padding:9px 15px;font-size:13px;font-weight:700;color:var(--text);}
.btnDanger{border:none;background:var(--danger-soft);color:var(--danger);border-radius:var(--r-sm);padding:9px 15px;font-size:13px;font-weight:700;}
.itemRow{border:1px solid var(--border);border-radius:var(--r-md);padding:10px;margin-bottom:10px;background:var(--surface-2);}
.itemRow .rowTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.itemRow .rowTop b{font-size:12px;color:var(--text-muted);}
.itemRow .rmBtn{border:none;background:none;color:var(--text-faint);font-size:12px;}
.itemRow .rmBtn:hover{color:var(--danger);}
.addItemBtn{width:100%;padding:10px;border:1px dashed var(--border-strong);border-radius:var(--r-md);background:none;color:var(--accent-strong);font-weight:700;font-size:12.5px;}
.chipRow{display:flex;flex-wrap:wrap;gap:6px;}
.chip{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}

/* ---------- admin ---------- */
.adminTabs{display:flex;gap:6px;padding:14px 16px 0;}
.adminTabs button{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--text-muted);}
.adminTabs button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}
.adminList{padding:14px 16px 24px;display:flex;flex-direction:column;gap:8px;}
.adminRow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;}
.adminRow .info{flex:1;min-width:0;}
.adminRow .info .n{font-weight:700;font-size:13px;}
.adminRow .info .m{font-size:11.5px;color:var(--text-muted);}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow);z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
footer.foot{padding:16px;text-align:center;font-size:11px;color:var(--text-faint);}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="loginCard">
    <div class="loginMark">TS</div>
    <h1 id="loginTitle">팀 스크럼 스케줄러 로그인</h1>

const DAY=86400000;
function pad(n){return String(n).padStart(2,'0');}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function dayDiff(a,b){return Math.round((startOfDay(b)-startOfDay(a))/DAY);}
const DOW=['일','월','화','수','목','금','토'];
function kDate(d){return (d.getMonth()+1)+'월 '+d.getDate()+'일';}
function kDateDow(d){return kDate(d)+' ('+DOW[d.getDay()]+')';}
function uid(p){return (p||'id')+'_'+Math.random().toString(36).slice(2,10);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}

function colorFor(seed){let h=0;for(const c of String(seed))h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length];}

/* ---------------- tiny store (db-backed or in-memory fallback) ---------------- */
function makeCollection(seed,dbCol){
  let cache=new Map(seed.map(x=>[x.id,x]));
  let ready=!dbCol;
  const listeners=new Set();
  function notify(){const arr=[...cache.values()];listeners.forEach(fn=>fn(arr));}
  if(dbCol){
    dbCol.get().then(snap=>{
      if(snap.empty){
        return Promise.all(seed.map(item=>{const d=Object.assign({},item);delete d.id;return dbCol.doc(item.id).set(d);})).catch(()=>{});
      }
    }).catch(()=>{}).finally(()=>{
      dbCol.onSnapshot(snap=>{
        cache=new Map(snap.docs.map(d=>[d.id,Object.assign({id:d.id},d.data())]));
        ready=true;notify();
      },()=>{});
    });
  }
  return {
    subscribe(fn){listeners.add(fn);if(ready)fn([...cache.values()]);return()=>listeners.delete(fn);},
    all(){return [...cache.values()];},
    async add(data){
      const id=data.id||uid('id');const body=Object.assign({},data);delete body.id;
      if(dbCol){await dbCol.doc(id).set(body);}else{cache.set(id,Object.assign({id},body));notify();}
      return id;
    },
    async update(id,data){
      if(dbCol){await dbCol.doc(id).update(data).catch(async()=>{await dbCol.doc(id).set(data);});}
      else{const cur=cache.get(id)||{id};cache.set(id,Object.assign({},cur,data));notify();}
    },
    async remove(id){
      if(dbCol){await dbCol.doc(id).delete();}else{cache.delete(id);notify();}
    }
  };
}

/* ---------------- app state ---------------- */
function viewLength(){return S.zoom==='week'?7:14;}
function centerOffset(n){return n===7?3:6;}

function taskById(id){return S.tasks.find(t=>t.id===id);}

/* ---------------- init ---------------- */
async function init(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth();
  const fsdb=firebase.firestore();
  S.auth=auth; S.fsdb=fsdb;

  store.members=makeCollection(SEED_MEMBERS, fsdb.collection('members'));
  store.tasks=makeCollection(SEED_TASKS, fsdb.collection('tasks'));
  store.vacations=makeCollection(SEED_VACATIONS, fsdb.collection('vacations'));
  store.externals=makeCollection(SEED_EXTERNAL, fsdb.collection('externalWorks'));
  store.holidays=makeCollection(SEED_HOLIDAYS, fsdb.collection('holidays'));
  store.scrum=makeCollection(SEED_SCRUM, fsdb.collection('scrum'));

  store.members.subscribe(v=>{S.members=v.slice().sort((a,b)=>(a.order||0)-(b.order||0));onDataChange();});
  store.tasks.subscribe(v=>{S.tasks=v;onDataChange();});
  store.vacations.subscribe(v=>{S.vacations=v;onDataChange();});
  store.externals.subscribe(v=>{S.externals=v;onDataChange();});
  store.holidays.subscribe(v=>{S.holidays=v;onDataChange();});
  store.scrum.subscribe(v=>{S.scrum=v;onDataChange();});

  wireLogin();
  wireApp();

  auth.onAuthStateChanged(async user=>{
    if(!user){
      S.pendingUid=null; S.me=null;
      showLoginScreen();
      return;
    }
    S.pendingUid=user.uid;
    try{
      const ref=fsdb.collection('members').doc(user.uid);
      const snap=await ref.get();
      if(!snap.exists){
        const countSnap=await fsdb.collection('members').get();
        const isFirst=countSnap.empty;
        await ref.set({
          name:user.displayName||(user.email||'').split('@')[0],
          email:(user.email||'').toLowerCase(),
          role:isFirst?'admin':'editor',
          team:'',
          order:countSnap.size
        });
      }
    }catch(e){ console.error('프로필 생성 실패',e); }
    tryEnterFromPending();
  });
}

  if(!S.pendingUid) return;

  if(document.getElementById('app').hidden){

/* ---------------- login / signup ---------------- */
let loginMode='login';
function setLoginMode(m){
  loginMode=m;
  document.getElementById('nameField').hidden = m!=='signup';
  document.getElementById('loginName').required = m==='signup';
  document.getElementById('loginTitle').textContent = m==='signup' ? '팀 스크럼 스케줄러 회원가입' : '팀 스크럼 스케줄러 로그인';
  document.getElementById('loginSub').textContent = m==='signup' ? '이름·이메일·비밀번호를 입력해 계정을 만드세요.' : '이메일과 비밀번호로 로그인해 주세요.';
  document.getElementById('loginSubmitBtn').textContent = m==='signup' ? '회원가입' : '로그인';
  document.getElementById('modeToggleText').textContent = m==='signup' ? '이미 계정이 있으신가요?' : '아직 계정이 없으신가요?';
  document.getElementById('modeToggleBtn').textContent = m==='signup' ? '로그인' : '회원가입';
  document.getElementById('loginErr').hidden=true;
}
function showLoginScreen(){
  document.getElementById('app').hidden=true;
  document.getElementById('loginScreen').hidden=false;
  document.getElementById('loginForm').reset();
  setLoginMode('login');
}
function showLoginErr(msg){ const el=document.getElementById('loginErr'); el.textContent=msg; el.hidden=false; }
function authErrMsg(err){
  const map={
    'auth/invalid-email':'이메일 형식이 올바르지 않습니다.',
    'auth/user-not-found':'등록되지 않은 이메일입니다.',
    'auth/wrong-password':'비밀번호가 일치하지 않습니다.',
    'auth/invalid-credential':'이메일 또는 비밀번호가 일치하지 않습니다.',
    'auth/email-already-in-use':'이미 가입된 이메일입니다. 로그인을 이용해 주세요.',
    'auth/weak-password':'비밀번호는 6자 이상이어야 해요.',
    'auth/too-many-requests':'시도가 너무 많습니다. 잠시 후 다시 시도해 주세요.',
    'auth/network-request-failed':'네트워크 오류가 발생했습니다. 연결 상태를 확인해 주세요.',
    'auth/unauthorized-domain':'이 도메인은 Firebase 인증에 등록되어 있지 않습니다. 관리자에게 문의해 주세요.'
  };
  return map[err.code] || ('오류가 발생했습니다: '+(err.message||err.code||''));
}
function wireLogin(){
  document.getElementById('pwToggleBtn').addEventListener('click',()=>{
    const inp=document.getElementById('loginPw');
    const btn=document.getElementById('pwToggleBtn');
    if(inp.type==='password'){inp.type='text';btn.textContent='숨김';}else{inp.type='password';btn.textContent='표시';}
  });
  document.getElementById('modeToggleBtn').addEventListener('click',e=>{
    e.preventDefault();
    setLoginMode(loginMode==='signup'?'login':'signup');
  });
  document.getElementById('forgotPwBtn').addEventListener('click',async e=>{
    e.preventDefault();
    const email=document.getElementById('loginEmail').value.trim();
    if(!email){ showLoginErr('비밀번호를 재설정할 이메일을 먼저 입력해 주세요.'); return; }
    try{ await S.auth.sendPasswordResetEmail(email); toast('재설정 메일을 보냈습니다. 메일함을 확인해 주세요.'); document.getElementById('loginErr').hidden=true; }
    catch(err){ showLoginErr(authErrMsg(err)); }
  });
  document.getElementById('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const email=document.getElementById('loginEmail').value.trim().toLowerCase();
    const pw=document.getElementById('loginPw').value;
    const name=document.getElementById('loginName').value.trim();
    const btn=document.getElementById('loginSubmitBtn');
    btn.disabled=true;
    try{
      if(loginMode==='signup'){
        if(!name){ showLoginErr('이름을 입력해 주세요.'); btn.disabled=false; return; }
        const cred=await S.auth.createUserWithEmailAndPassword(email,pw);
        await cred.user.updateProfile({displayName:name}).catch(()=>{});
      } else {
        await S.auth.signInWithEmailAndPassword(email,pw);
      }
      document.getElementById('loginErr').hidden=true;
    }catch(err){ showLoginErr(authErrMsg(err)); }
    btn.disabled=false;
  });
}
function enterApp(member){
  S.me=member;

/* ---------------- top-level UI wiring ---------------- */
function wireApp(){
  document.getElementById('mainTabs').addEventListener('click',e=>{
    const b=e.target.closest('button[data-tab]'); if(!b)return;
    S.tab=b.dataset.tab;
    document.querySelectorAll('#mainTabs button').forEach(x=>x.classList.toggle('active',x===b));
    document.getElementById('scheduleView').hidden = S.tab!=='schedule';
    document.getElementById('taskView').hidden = S.tab!=='task';
  });
  document.getElementById('memberFilter').addEventListener('change',e=>{S.memberFilter=e.target.value;renderTimeline();renderScrum();renderTasks();});
  document.getElementById('densityTabs').addEventListener('click',e=>{
    const b=e.target.closest('button[data-d]'); if(!b)return;
    S.density=b.dataset.d;
    document.querySelectorAll('#densityTabs button').forEach(x=>x.classList.toggle('active',x===b));
    renderTimeline();
  });
  document.getElementById('zoomTabs').addEventListener('click',e=>{
    const b=e.target.closest('button[data-z]'); if(!b)return;
    const oldCenter=addDays(S.windowStart,centerOffset(viewLength()));
    S.zoom=b.dataset.z;
    S.windowStart=addDays(oldCenter,-centerOffset(viewLength()));
    document.querySelectorAll('#zoomTabs button').forEach(x=>x.classList.toggle('active',x===b));
    renderTimeline();
  });
  document.getElementById('prevBtn').addEventListener('click',()=>{S.windowStart=addDays(S.windowStart,-viewLength());renderTimeline();});
  document.getElementById('nextBtn').addEventListener('click',()=>{S.windowStart=addDays(S.windowStart,viewLength());renderTimeline();});
  document.getElementById('todayBtn').addEventListener('click',()=>{S.windowStart=addDays(TODAY,-centerOffset(viewLength()));renderTimeline();});
  document.getElementById('newBtn').addEventListener('click',openNewChooser);
  document.getElementById('adminBtn').addEventListener('click',openAdmin);
  document.getElementById('accountBtn').addEventListener('click',openAccount);
  window.addEventListener('resize',debounce(()=>renderTimeline(),200));
}
function throttle(fn,ms){let t=0;return(...a)=>{const now=Date.now();if(now-t>ms){t=now;fn(...a);}};}
function debounce(fn,ms){let h;return(...a)=>{clearTimeout(h);h=setTimeout(()=>fn(...a),ms);};}

function populateMemberFilter(){
  const sel=document.getElementById('memberFilter');
  const cur=sel.value||'all';
  sel.innerHTML='<option value="all">전체 구성원</option>'+S.members.map(m=>'<option value="'+m.id+'">'+esc(m.name)+'</option>').join('');
  sel.value=[...sel.options].some(o=>o.value===cur)?cur:'all';
}

/* ---------------- timeline ---------------- */
let dayWidth=64;
function visibleMemberIds(){return S.memberFilter==='all'?S.members.map(m=>m.id):[S.memberFilter];}

function computeDayWidth(){
  const viewport=document.getElementById('tlScroll').clientWidth||360;
  const n=viewLength();
  dayWidth=clamp(Math.floor(viewport/n),34,220);
}

function renderTimeline(){
  if(document.getElementById('app').hidden) return;
  computeDayWidth();
  const inner=document.getElementById('tlInner');
  const nDays=viewLength();
  const winStart=S.windowStart;
  const winEnd=addDays(winStart,nDays-1);
  const width=nDays*dayWidth;
  const filterIds=new Set(visibleMemberIds());
  document.getElementById('rangeLabel').textContent=kDate(winStart)+' – '+kDate(winEnd);

  // clip a [start,end] range (strings) to the visible window; null if no overlap
  function clipToWindow(startStr,endStr){
    const s=parse(startStr), e=parse(endStr);
    const cs = s<winStart?winStart:s;
    const ce = e>winEnd?winEnd:e;
    if(ce<cs || e<winStart || s>winEnd) return null;
    return {cs,ce,clippedStart:s<winStart,clippedEnd:e>winEnd};
  }

  const fixedItems=[];
  S.vacations.forEach(v=>{ if(filterIds.has(v.memberId)){ const c=clipToWindow(v.start,v.end); if(c) fixedItems.push({type:'vac',c,label:'🏖️ '+((memberById(v.memberId)||{}).name||'')+' 휴가'+(v.half==='am'?' · 오전 반차':v.half==='pm'?' · 오후 반차':'')+(v.note?' · '+v.note:''),data:v}); } });
  S.externals.forEach(x=>{ if(x.memberIds.some(id=>filterIds.has(id))){ const c=clipToWindow(x.start,x.end); if(c) fixedItems.push({type:'ext',c,label:'🕴️ '+x.title+' · '+x.memberIds.map(id=>(memberById(id)||{}).name).filter(Boolean).join(', '),data:x}); } });

  const taskItems=[];
  if(S.density==='full'){
    S.tasks.forEach(t=>{
      const assignees=[t.uxAssignee,...(t.designAssignees||[])].filter(Boolean);
      if(assignees.length && !assignees.some(id=>filterIds.has(id))) return;
      const c=clipToWindow(t.start,t.end); if(c) taskItems.push({c,data:t});
    });
  }

  let html='';
  html+='<div class="tlHeaderRow" style="width:'+width+'px">';
  for(let i=0;i<nDays;i++){
    const d=addDays(winStart,i);
    const ds=fmt(d);
    const hol=holidayOn(ds);
    const isWknd=(d.getDay()===0||d.getDay()===6);
    const isToday=dayDiff(TODAY,d)===0;
    html+='<div class="tlDayHead'+(isWknd?' weekend':'')+(hol?' holiday':'')+(isToday?' today':'')+'" data-date="'+ds+'" style="width:'+dayWidth+'px">'
      +'<span class="dow">'+DOW[d.getDay()]+'</span><span class="dnum">'+d.getDate()+'</span>'
      +(hol?'<span class="hname" title="'+esc(hol.name)+'">'+esc(hol.name)+'</span>':'')
      +'</div>';
  }
  html+='</div>';

  html+='<div class="tlBody" style="width:'+width+'px;">';
  for(let i=0;i<nDays;i++){
    const d=addDays(winStart,i);
    const ds=fmt(d);
    const hol=holidayOn(ds);
    const isWknd=(d.getDay()===0||d.getDay()===6);
    if(hol||isWknd) html+='<div class="tlBg '+(hol?'holiday':'weekend')+'" style="left:'+(i*dayWidth)+'px;width:'+dayWidth+'px;"></div>';
  }
  if(TODAY>=winStart && TODAY<=winEnd){
    const todayIdx=dayDiff(winStart,TODAY);
    html+='<div class="tlToday" style="left:'+(todayIdx*dayWidth)+'px;"></div>';
  }

  const rowH=30, gap=6;
  html+='<div class="tlSectionLabel" style="top:0">고정 일정</div>';
  const fixedTop=26;
  if(fixedItems.length===0){
    html+='<div style="position:absolute;top:'+(fixedTop)+'px;left:12px;color:var(--text-faint);font-size:11.5px;">해당 일정이 없습니다.</div>';
  } else {
    fixedItems.forEach((it,idx)=>{
      const left=dayDiff(winStart,it.c.cs)*dayWidth+2;
      const w=Math.max(dayWidth-4,(dayDiff(it.c.cs,it.c.ce)+1)*dayWidth-4);
      const top=fixedTop+idx*(rowH+gap);
      html+='<div class="bar '+it.type+'" data-kind="'+it.type+'" data-id="'+it.data.id+'" style="left:'+left+'px;top:'+top+'px;height:'+rowH+'px;width:'+w+'px;"><span class="lbl">'+(it.c.clippedStart?'◀':'')+esc(it.label)+(it.c.clippedEnd?'▶':'')+'</span></div>';
    });
  }
  const rowsUsed=Math.max(1,fixedItems.length);
  const taskTop=fixedTop+rowsUsed*(rowH+gap)+26;
  html+='<div class="tlSectionLabel" style="position:absolute;left:8px;top:'+(taskTop-24)+'px;">과제 트랙</div>';
  let taskRows=1;
  if(S.density==='full'){
    if(taskItems.length===0){
      html+='<div style="position:absolute;top:'+taskTop+'px;left:12px;color:var(--text-faint);font-size:11.5px;">표시할 과제가 없습니다.</div>';
    } else {
      taskRows=taskItems.length;
      taskItems.forEach((it,idx)=>{
        const t=it.data;
        const left=dayDiff(winStart,it.c.cs)*dayWidth+2;
        const w=Math.max(dayWidth-4,(dayDiff(it.c.cs,it.c.ce)+1)*dayWidth-4);
        const top=taskTop+idx*(rowH+gap);
        html+='<div class="bar task'+(t.status==='closed'?' closed':'')+'" data-kind="task" data-id="'+t.id+'" style="left:'+left+'px;top:'+top+'px;height:'+rowH+'px;width:'+w+'px;">'
          +(it.c.clippedStart?'':'<span class="code">'+esc(t.code)+'</span>')+'<span class="lbl">'+esc(t.title)+'</span><span class="prog">'+t.progress+'%</span></div>';
      });
    }
  } else { taskRows=0; html+='<div style="position:absolute;top:'+taskTop+'px;left:12px;color:var(--text-faint);font-size:11.5px;">요약 보기에서는 과제 트랙이 숨겨집니다.</div>'; }
  const bodyH=taskTop+taskRows*(rowH+gap)+16;
  html+='</div>';
  inner.innerHTML=html;
  inner.style.height=bodyH+'px';
  inner.querySelector('.tlBody').style.height=bodyH+'px';

  inner.querySelectorAll('.tlDayHead').forEach(el=>{
    el.addEventListener('click',()=>{S.scrumDate=el.dataset.date;renderScrum();});
  });
  inner.querySelectorAll('.bar').forEach(el=>{
    el.addEventListener('click',()=>{
      const kind=el.dataset.kind,id=el.dataset.id;
      if(kind==='task') openTaskDetail(id);
      else if(kind==='vac') openVacationForm(S.vacations.find(v=>v.id===id));
      else if(kind==='ext') openExternalForm(S.externals.find(x=>x.id===id));
    });
  });
}

/* ---------------- scrum board ---------------- */
function renderScrum(){
  if(document.getElementById('app').hidden) return;
  const d=parse(S.scrumDate);
  document.getElementById('scrumTitle').textContent=kDateDow(d)+' 스크럼';
  const filterIds=new Set(visibleMemberIds());
  const members=S.members.filter(m=>filterIds.has(m.id));
  const entriesByMember=new Map();
  S.scrum.filter(s=>s.date===S.scrumDate).forEach(s=>entriesByMember.set(s.memberId,s));

  const pending=members.filter(m=>!entriesByMember.has(m.id));
  const done=members.filter(m=>entriesByMember.has(m.id));
  document.getElementById('pendingCount').textContent=pending.length;
  document.getElementById('doneCount').textContent=done.length;
  document.getElementById('scrumCnt').textContent='구성원 '+members.length+'명 중 '+done.length+'명 작성 완료';

  const pendingEl=document.getElementById('pendingList');
  pendingEl.innerHTML = pending.length? pending.map(m=>
    '<div class="pendingRow"><span class="avatar" style="background:'+colorFor(m.id)+'">'+initials(m.name)+'</span>'+esc(m.name)
    +(S.me&&S.me.id===m.id?'<button class="writeBtn" data-write="'+m.id+'">작성하기</button>':'')
    +'</div>').join('') : '<div class="scrumEmpty">해당 카드가 없습니다.</div>';
  pendingEl.querySelectorAll('[data-write]').forEach(b=>b.addEventListener('click',()=>openScrumEditor(b.dataset.write,null)));

  const doneEl=document.getElementById('doneList');
  doneEl.innerHTML = done.length? done.map(m=>{
    const entry=entriesByMember.get(m.id);
    const itemsHtml=(entry.items||[]).map(it=>{
      const t=taskById(it.taskId);
      const prio=it.priority?('<span class="prio '+it.priority+'">'+({p1:'우선순위 1',p2:'우선순위 2',p3:'우선순위 3'}[it.priority]||'')+'</span>'):'';
      return '<div class="item"><div class="taskLine">'+(t?'<span class="code">'+esc(t.code)+'</span>'+esc(t.title):'<span>기타</span>')+prio+'</div>'
        +(it.note?'<div class="note">'+esc(it.note)+'</div>':'')
        +'<div class="metaRow"><div class="progBar"><i style="width:'+clamp(it.progress||0,0,100)+'%"></i></div><span class="progNum">'+(it.progress||0)+'%</span></div>'
        +(it.link?'<div style="margin-top:5px;"><a class="outlink" target="_blank" rel="noopener" href="'+esc(it.link)+'">산출물 링크 ↗</a></div>':'')
        +'</div>';
    }).join('') || '<div class="note">작성된 항목이 없습니다.</div>';
    const canEdit=S.me && (S.me.id===m.id || isAdmin());
    return '<div class="card"><div class="cHead"><span class="avatar" style="background:'+colorFor(m.id)+'">'+initials(m.name)+'</span><b>'+esc(m.name)+'</b><span class="role">'+esc(m.team||'')+'</span>'
      +(canEdit?'<button class="more" data-more="'+m.id+'" title="더보기">⋯</button>':'')+'</div>'+itemsHtml+'</div>';
  }).join('') : '<div class="scrumEmpty">해당 카드가 없습니다.</div>';
  doneEl.querySelectorAll('[data-more]').forEach(b=>b.addEventListener('click',()=>{
    const mid=b.dataset.more; const entry=entriesByMember.get(mid);
    openScrumEditor(mid,entry);
  }));
}

/* ---------------- tasks table ---------------- */
function renderTasks(){
  if(document.getElementById('app').hidden) return;
  const filterIds=new Set(visibleMemberIds());
  const rows=S.tasks.filter(t=>{
    const assignees=[t.uxAssignee,...(t.designAssignees||[])].filter(Boolean);
    return assignees.length===0 || assignees.some(id=>filterIds.has(id));
  }).slice().sort((a,b)=>parse(b.start)-parse(a.start));
  document.getElementById('taskCnt').textContent=rows.length+'건';
  document.getElementById('taskTbody').innerHTML = rows.map(t=>{
    const ux=memberById(t.uxAssignee);
    const dz=(t.designAssignees||[]).map(id=>memberById(id)).filter(Boolean).map(m=>m.name).join(', ');
    return '<tr><td><span class="tCode">'+esc(t.code)+'</span></td>'
      +'<td><span class="tCat">'+esc(t.category||'-')+'</span></td>'
      +'<td class="tTitle">'+esc(t.title)+'</td>'
      +'<td>'+(ux?'UX '+esc(ux.name):'')+(dz?(ux?' · ':'')+'Design '+esc(dz):'')+'</td>'
      +'<td>'+(t.ticket?esc(t.ticket):'-')+'</td>'
      +'<td style="white-space:nowrap;font-family:var(--font-mono);font-size:11px;">'+t.start+' ~ '+t.end+'</td>'
      +'<td><div class="miniProg"><div class="progBar"><i style="width:'+t.progress+'%"></i></div><span class="progNum">'+t.progress+'%</span></div></td>'
      +'<td><span class="tStatus '+(t.status==='closed'?'closed':'ongoing')+'">'+(t.status==='closed'?'종료됨':'진행중')+'</span></td>'
      +'<td class="rowActions"><button data-edit="'+t.id+'" title="수정">✎</button><button data-del="'+t.id+'" title="삭제">🗑</button></td></tr>';
  }).join('') || '<tr><td colspan="9" style="text-align:center;color:var(--text-faint);padding:24px;">과제가 없습니다.</td></tr>';
  document.getElementById('taskTbody').querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openTaskForm(taskById(b.dataset.edit))));
  document.getElementById('taskTbody').querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    if(confirm('이 과제를 삭제할까요?')) store.tasks.remove(b.dataset.del).then(()=>toast('과제를 삭제했습니다.'));
  }));
}

/* ---------------- modal helpers ---------------- */
function openModal(innerHtml,onMount){
  const root=document.getElementById('modalRoot');
  root.innerHTML='<div class="overlay" id="ovl"><div class="modal">'+innerHtml+'</div></div>';
  const ovl=document.getElementById('ovl');
  ovl.addEventListener('mousedown',e=>{if(e.target===ovl)closeModal();});
  if(onMount)onMount(root);
}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}

/* -------- new item chooser -------- */
function openNewChooser(){

    '<button class="modalClose" onclick="window.__closeModal()">✕</button>'

      root.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{

/* -------- task form -------- */
function openTaskForm(task){
  const isEdit=!!task;
  task=task||{id:null,code:'',category:'',title:'',uxAssignee:'',designAssignees:[],ticket:'',start:fmt(TODAY),end:fmt(TODAY),progress:0,status:'ongoing',subtasks:[]};
  const memberOpts=S.members.map(m=>'<option value="'+m.id+'" '+(task.uxAssignee===m.id?'selected':'')+'>'+esc(m.name)+'</option>').join('');
  openModal(
    '<button class="modalClose" onclick="window.__closeModal()">✕</button>'
    +'<h3>'+(isEdit?'과제 수정':'새 과제')+'</h3><p class="desc">일정 타임라인과 과제 목록에 함께 표시됩니다.</p>'
    +'<form id="taskForm"><div class="formGrid">'
    +field('코드','code',task.code,'text','예: T101')
    +field('구분','category',task.category,'text','예: 다이렉트')
    +'<div class="field2 full"><label>과제명</label><input name="title" value="'+esc(task.title)+'" required></div>'
    +'<div class="field2"><label>UX 담당</label><select name="uxAssignee"><option value="">미정</option>'+memberOpts+'</select></div>'
    +field('티켓 번호','ticket',task.ticket,'text','예: #12345')
    +field('시작일','start',task.start,'date')
    +field('종료일','end',task.end,'date')
    +field('진행률(%)','progress',task.progress,'number')
    +'<div class="field2"><label>상태</label><select name="status"><option value="ongoing" '+(task.status==='ongoing'?'selected':'')+'>진행중</option><option value="closed" '+(task.status==='closed'?'selected':'')+'>종료됨</option></select></div>'
    +'</div>'
    +'<div class="modalActions">'+(isEdit?'<button type="button" class="btnDanger" id="taskDel">삭제</button>':'')+'<button type="button" class="btnGhost" onclick="window.__closeModal()">취소</button><button class="btnPrimary" style="width:auto;">저장</button></div>'
    +'</form>', root=>{
      window.__closeModal=closeModal;
      root.querySelector('#taskDel')&&root.querySelector('#taskDel').addEventListener('click',()=>{
        if(confirm('삭제할까요?')) store.tasks.remove(task.id).then(()=>{toast('삭제했습니다.');closeModal();});
      });
      root.querySelector('#taskForm').addEventListener('submit',async e=>{
        e.preventDefault();
        const f=new FormData(e.target);
        const data={code:f.get('code')||'',category:f.get('category')||'',title:f.get('title'),uxAssignee:f.get('uxAssignee')||'',designAssignees:task.designAssignees||[],ticket:f.get('ticket')||'',start:f.get('start'),end:f.get('end'),progress:clamp(Number(f.get('progress'))||0,0,100),status:f.get('status'),subtasks:task.subtasks||[]};
        if(isEdit) await store.tasks.update(task.id,data); else await store.tasks.add(data);
        toast('저장했습니다.'); closeModal();
      });
    });
}
function field(label,name,val,type,ph){
  return '<div class="field2"><label>'+label+'</label><input name="'+name+'" type="'+(type||'text')+'" value="'+esc(val==null?'':val)+'" '+(ph?'placeholder="'+ph+'"':'')+'></div>';
}

    +field('시작일','start',x.start,'date')+field('종료일','end',x.end,'date')

    +'</div><div class="modalActions">'+(isEdit?'<button type="button" class="btnDanger" id="extDel">삭제</button>':'')+'<button type="button" class="btnGhost" onclick="window.__closeModal()">취소</button><button class="btnPrimary" style="width:auto;">저장</button></div></form>',
    root=>{
      window.__closeModal=closeModal;
      let picked=new Set(x.memberIds);
      root.querySelectorAll('[data-mid]').forEach(chip=>chip.addEventListener('click',()=>{

      }));
      root.querySelector('#extDel')&&root.querySelector('#extDel').addEventListener('click',()=>{if(confirm('삭제할까요?'))store.externals.remove(x.id).then(()=>{toast('삭제했습니다.');closeModal();});});
      root.querySelector('#extForm').addEventListener('submit',async e=>{
        e.preventDefault();const f=new FormData(e.target);
        const data={title:f.get('title'),memberIds:[...picked],start:f.get('start'),end:f.get('end'),timeStart:f.get('timeStart'),timeEnd:f.get('timeEnd')};
        if(isEdit) await store.externals.update(x.id,data); else await store.externals.add(data);
        toast('저장했습니다.');closeModal();
      });
    });
}

}

/* -------- scrum editor -------- */
function openScrumEditor(memberId,entry){
  const member=memberById(memberId);
  const items=(entry&&entry.items&&entry.items.length)?JSON.parse(JSON.stringify(entry.items)):[{taskId:'',note:'',priority:'p3',progress:0,link:''}];
  const canEdit=S.me && (S.me.id===memberId || isAdmin());
  function itemHtml(it,idx){
    const taskOpts='<option value="">기타</option>'+S.tasks.map(t=>'<option value="'+t.id+'" '+(it.taskId===t.id?'selected':'')+'>'+esc(t.code)+' '+esc(t.title)+'</option>').join('');
    return '<div class="itemRow" data-idx="'+idx+'"><div class="rowTop"><b>항목 '+(idx+1)+'</b>'+(items.length>1?'<button type="button" class="rmBtn" data-rm="'+idx+'">삭제</button>':'')+'</div>'
      +'<div class="formGrid">'
      +'<div class="field2 full"><label>관련 과제</label><select data-f="taskId" data-idx="'+idx+'">'+taskOpts+'</select></div>'
      +'<div class="field2 full"><label>작업 내용</label><textarea data-f="note" data-idx="'+idx+'" placeholder="오늘 진행한 작업을 적어주세요">'+esc(it.note||'')+'</textarea></div>'
      +'<div class="field2"><label>우선순위</label><select data-f="priority" data-idx="'+idx+'"><option value="p1" '+(it.priority==='p1'?'selected':'')+'>우선순위 1</option><option value="p2" '+(it.priority==='p2'?'selected':'')+'>우선순위 2</option><option value="p3" '+(it.priority==='p3'?'selected':'')+'>우선순위 3</option></select></div>'
      +'<div class="field2"><label>진행률(%)</label><input data-f="progress" data-idx="'+idx+'" type="number" min="0" max="100" value="'+(it.progress||0)+'"></div>'
      +'<div class="field2 full"><label>산출물 링크 (선택)</label><input data-f="link" data-idx="'+idx+'" type="url" placeholder="https://..." value="'+esc(it.link||'')+'"></div>'
      +'</div></div>';
  }
  function render(root){
    root.querySelector('#itemsHost').innerHTML=items.map(itemHtml).join('');
    root.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{items.splice(Number(b.dataset.rm),1);render(root);}));
    root.querySelectorAll('[data-f]').forEach(inp=>inp.addEventListener('input',()=>{
      const idx=Number(inp.dataset.idx),f=inp.dataset.f;
      items[idx][f]= f==='progress'? clamp(Number(inp.value)||0,0,100) : inp.value;
    }));
  }
  openModal('<button class="modalClose" onclick="window.__closeModal()">✕</button>'
    +'<h3>'+esc(member.name)+'님의 스크럼</h3><p class="desc">'+kDateDow(parse(S.scrumDate))+'</p>'
    +'<form id="scrumForm"><div id="itemsHost"></div>'
    +(canEdit?'<button type="button" class="addItemBtn" id="addItem">+ 항목 추가</button>':'')
    +(canEdit?'<div class="modalActions">'+(entry?'<button type="button" class="btnDanger" id="scrumDel">삭제</button>':'')+'<button type="button" class="btnGhost" onclick="window.__closeModal()">취소</button><button class="btnPrimary" style="width:auto;">제출</button></div>':'<div class="modalActions"><button type="button" class="btnGhost" onclick="window.__closeModal()">닫기</button></div>')
    +'</form>', root=>{
      window.__closeModal=closeModal;
      render(root);
      if(!canEdit){ root.querySelectorAll('#itemsHost select,#itemsHost input,#itemsHost textarea').forEach(el=>el.disabled=true); }
      root.querySelector('#addItem')&&root.querySelector('#addItem').addEventListener('click',()=>{items.push({taskId:'',note:'',priority:'p3',progress:0,link:''});render(root);});
      root.querySelector('#scrumDel')&&root.querySelector('#scrumDel').addEventListener('click',async()=>{
        if(confirm('작성한 스크럼을 삭제할까요?')){await store.scrum.remove(entry.id);toast('삭제했습니다.');closeModal();}
      });
      root.querySelector('#scrumForm').addEventListener('submit',async e=>{
        e.preventDefault();
        if(!canEdit)return;
        const id=S.scrumDate+'_'+memberId;
        const data={date:S.scrumDate,memberId:memberId,status:'submitted',items:items};
        if(entry) await store.scrum.update(id,data); else await store.scrum.add(Object.assign({id:id},data));
        toast('스크럼을 제출했습니다.'); closeModal();
      });
    });
}

/* -------- admin -------- */
function openAdmin(){
  if(!isAdmin())return;
  let tab='members';
  function body(){
    if(tab==='members'){
      return S.members.map(m=>'<div class="adminRow"><span class="avatar" style="background:'+colorFor(m.id)+'">'+initials(m.name)+'</span>'
        +'<div class="info"><div class="n">'+esc(m.name)+' <span style="color:var(--text-faint);font-weight:400;">'+(m.role==='admin'?'· 관리자':'· 편집자')+'</span></div><div class="m">'+esc(m.email)+' · '+(m.team||'-')+'</div></div>'
        +'<div class="rowActions"><button data-medit="'+m.id+'">✎</button>'+(S.members.length>1?'<button data-mdel="'+m.id+'">🗑</button>':'')+'</div></div>').join('')
        +'<div style="font-size:11.5px;color:var(--text-faint);padding:10px 2px 0;line-height:1.6;">새 팀원은 로그인 화면에서 이메일로 직접 회원가입하면 자동으로 이 목록에 추가돼요. 가입 후 이름·팀·역할은 여기서 조정해 주세요.</div>';
    }
    return S.holidays.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(h=>'<div class="adminRow"><div class="info"><div class="n">'+esc(h.name)+'</div><div class="m">'+h.date+'</div></div>'
      +'<div class="rowActions"><button data-hedit="'+h.id+'">✎</button><button data-hdel="'+h.id+'">🗑</button></div></div>').join('')
      +'<button class="iconBtn solid" id="addHoliday" style="margin-top:6px;">+ 휴일 추가</button>';
  }
  function wire(root){
    root.querySelectorAll('[data-tabb]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tabb;paint(root);}));
    if(tab==='members'){
      root.querySelectorAll('[data-medit]').forEach(b=>b.addEventListener('click',()=>openMemberForm(memberById(b.dataset.medit))));
      root.querySelectorAll('[data-mdel]').forEach(b=>b.addEventListener('click',()=>{ if(confirm('목록에서 제거할까요? (로그인 계정 자체는 남아 있고, 다시 로그인하면 편집자로 자동 등록돼요)')) store.members.remove(b.dataset.mdel).then(()=>{toast('제거했습니다.');paint(root);}); }));
    } else {
      root.querySelectorAll('[data-hedit]').forEach(b=>b.addEventListener('click',()=>openHolidayForm(S.holidays.find(h=>h.id===b.dataset.hedit))));
      root.querySelectorAll('[data-hdel]').forEach(b=>b.addEventListener('click',()=>{ if(confirm('삭제할까요?')) store.holidays.remove(b.dataset.hdel).then(()=>{toast('삭제했습니다.');paint(root);}); }));
      root.querySelector('#addHoliday')&&root.querySelector('#addHoliday').addEventListener('click',()=>openHolidayForm(null));
    }
  }
  function paint(root){
    root.querySelector('#adminBody').innerHTML=body();
    root.querySelectorAll('.adminTabs button').forEach(b=>b.classList.toggle('active',b.dataset.tabb===tab));
    wire(root);
  }
  openModal('<button class="modalClose" onclick="window.__closeModal()">✕</button><h3>관리</h3><p class="desc">구성원과 공휴일을 관리합니다.</p>'
    +'<div class="adminTabs" style="padding:0 0 10px;"><button data-tabb="members" class="active">구성원</button><button data-tabb="holidays">공휴일</button></div>'
    +'<div id="adminBody"></div>', root=>{ window.__closeModal=closeModal; paint(root); });
}
function openMemberForm(m){
  if(!m)return;
  openModal('<button class="modalClose" onclick="window.__closeModal()">✕</button><h3>구성원 수정</h3><p class="desc">이메일·비밀번호는 본인이 로그인 화면에서만 바꿀 수 있어요.</p>'
    +'<form id="memForm"><div class="formGrid">'
    +field('이름','name',m.name,'text')
    +'<div class="field2"><label>이메일</label><input value="'+esc(m.email)+'" disabled></div>'
    +'<div class="field2"><label>팀</label><select name="team"><option value="" '+(!m.team?'selected':'')+'>미지정</option><option value="UX" '+(m.team==='UX'?'selected':'')+'>UX</option><option value="Design" '+(m.team==='Design'?'selected':'')+'>Design</option><option value="PM" '+(m.team==='PM'?'selected':'')+'>PM</option></select></div>'
    +'<div class="field2"><label>역할</label><select name="role"><option value="editor" '+(m.role==='editor'?'selected':'')+'>편집자</option><option value="admin" '+(m.role==='admin'?'selected':'')+'>관리자</option></select></div>'
    +'</div><div class="modalActions"><button type="button" class="btnDanger" id="memDel">목록에서 제거</button><button type="button" class="btnGhost" onclick="window.__closeModal()">취소</button><button class="btnPrimary" style="width:auto;">저장</button></div></form>',
    root=>{ window.__closeModal=closeModal;
      root.querySelector('#memDel').addEventListener('click',()=>{
        if(confirm('목록에서 제거할까요? (로그인 계정 자체는 남아 있고, 다시 로그인하면 편집자로 자동 등록돼요)')) store.members.remove(m.id).then(()=>{toast('제거했습니다.');closeModal();});
      });
      root.querySelector('#memForm').addEventListener('submit',async e=>{
        e.preventDefault(); const f=new FormData(e.target);
        const data={name:f.get('name'),team:f.get('team'),role:f.get('role')};
        await store.members.update(m.id,data);
        toast('저장했습니다.'); closeModal(); openAdmin();
      });
    });
}
function openHolidayForm(h){
  const isEdit=!!h;
  h=h||{id:null,date:fmt(TODAY),name:''};
  openModal('<button class="modalClose" onclick="window.__closeModal()">✕</button><h3>'+(isEdit?'휴일 수정':'휴일 추가')+'</h3>'
    +'<form id="holForm"><div class="formGrid">'+field('날짜','date',h.date,'date')+field('이름','name',h.name,'text')+'</div>'
    +'<div class="modalActions">'+(isEdit?'<button type="button" class="btnDanger" id="holDel">삭제</button>':'')+'<button type="button" class="btnGhost" onclick="window.__closeModal()">취소</button><button class="btnPrimary" style="width:auto;">저장</button></div></form>',
    root=>{ window.__closeModal=closeModal;
      root.querySelector('#holDel')&&root.querySelector('#holDel').addEventListener('click',()=>{ if(confirm('삭제할까요?')) store.holidays.remove(h.id).then(()=>{toast('삭제했습니다.');closeModal();openAdmin();}); });
      root.querySelector('#holForm').addEventListener('submit',async e=>{
        e.preventDefault(); const f=new FormData(e.target);
        const data={date:f.get('date'),name:f.get('name')};
        if(isEdit) await store.holidays.update(h.id,data); else await store.holidays.add(data);
        toast('저장했습니다.'); closeModal(); openAdmin();
      });
    });
}

/* -------- my account -------- */
function openAccount(){
  const m=S.me; if(!m)return;
  openModal('<button class="modalClose" onclick="window.__closeModal()">✕</button><h3>내 계정</h3>'
    +'<form id="accForm"><div class="formGrid">'
    +field('이름','name',m.name,'text')+field('새 비밀번호','password','','text','변경 시에만 입력')
    +'<div class="field2 full"><label>이메일</label><input value="'+esc(m.email)+'" disabled></div>'
    +'<div class="field2 full"><label>역할</label><input value="'+(m.role==='admin'?'관리자':'편집자')+'" disabled></div>'
    +'</div><div class="modalActions"><button type="button" class="btnGhost" id="logoutBtn">로그아웃</button><button class="btnPrimary" style="width:auto;">저장</button></div></form>',
    root=>{ window.__closeModal=closeModal;
      root.querySelector('#logoutBtn').addEventListener('click',()=>{closeModal();logout();});
      root.querySelector('#accForm').addEventListener('submit',async e=>{
        e.preventDefault(); const f=new FormData(e.target);
        const newName=f.get('name'); const newPw=f.get('password');
        try{
          if(newName && newName!==m.name){
            await store.members.update(m.id,{name:newName});
            S.auth.currentUser.updateProfile({displayName:newName}).catch(()=>{});
          }
          if(newPw){ await S.auth.currentUser.updatePassword(newPw); }
          S.me=Object.assign({},m,{name:newName||m.name});
          toast('저장했습니다.'); closeModal(); renderMe();
        }catch(err){
          if(err.code==='auth/requires-recent-login'){ toast('보안을 위해 다시 로그인한 뒤 비밀번호를 변경해 주세요.'); }
          else { toast('저장에 실패했습니다: '+(err.message||err.code||'')); }
        }
      });
    });
}

init();
})();
</script>
